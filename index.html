                                    <div className="flex-1 flex items-center justify-center text-slate-400 flex-col gap-4 bg-white m-4 rounded-xl border border-slate-200 border-dashed">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1" strokeLinecap="round" strokeLinejoin="round" className="text-slate-300"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                        <p className="text-sm">左側のリストからデータを選択するか、新しいCSVを読み込んでください。</p>
                                    </div>
                                )}

                                {/* --- Settings Panel (Slide Over) --- */}
                                <div className={`absolute inset-y-0 right-0 w-80 bg-white shadow-2xl transform transition-transform duration-300 z-50 flex flex-col border-l border-slate-200 ${isSettingsOpen ? 'translate-x-0' : 'translate-x-full'}`}>
                                    <div className="p-4 border-b border-slate-200 flex justify-between items-center bg-slate-50">
                                        <h3 className="font-bold text-slate-700 flex items-center gap-2 text-sm"><IconSettings /> データ連携・設定</h3>
                                        <button onClick={() => setIsSettingsOpen(false)} className="text-slate-400 hover:text-slate-600 transition-colors p-1"><IconX /></button>
                                    </div>
                                    
                                    <div className="p-4 flex-1 overflow-y-auto flex flex-col gap-6">
                                        
                                        {/* Firebase Config Accordion */}
                                        <div className="border border-slate-200 rounded-lg overflow-hidden bg-white shadow-sm">
                                            <button 
                                                onClick={() => setIsFirebaseConfigOpen(!isFirebaseConfigOpen)} 
                                                className="w-full p-3 bg-slate-50 flex justify-between items-center font-bold text-slate-700 hover:bg-slate-100 transition-colors text-[13px]"
                                            >
                                                <div className="flex items-center gap-2">
                                                    <IconFirebase /> Firebase設定
                                                </div>
                                                {isFirebaseConfigOpen ? <IconChevronUp /> : <IconChevronDown />}
                                            </button>
                                            
                                            {isFirebaseConfigOpen && (
                                                <div className="p-4 flex flex-col gap-3 border-t border-slate-200">
                                                    <label className="flex items-center gap-2 cursor-pointer text-xs font-medium">
                                                        <input 
                                                            type="checkbox" 
                                                            className="accent-green-500 w-4 h-4 cursor-pointer" 
                                                            checked={isFirebaseEnabled} 
                                                            onChange={e => setIsFirebaseEnabled(e.target.checked)} 
                                                        />
                                                        <span className={isFirebaseEnabled ? 'text-green-600 font-bold' : 'text-slate-400'}>有効です</span>
                                                    </label>
                                                    
                                                    <textarea 
                                                        className={`w-full text-[10px] font-mono p-2 border rounded h-32 outline-none transition-colors ${isFirebaseEnabled ? 'border-slate-300 bg-slate-50 focus:border-blue-500' : 'border-slate-200 bg-slate-100 text-slate-400 cursor-not-allowed'}`}
                                                        placeholder="{\n  &quot;apiKey&quot;: &quot;AIzaSy...&quot;,\n  &quot;authDomain&quot;: &quot;...&quot;,\n  &quot;projectId&quot;: &quot;...&quot;\n}"
                                                        value={firebaseConfig}
                                                        onChange={e => setFirebaseConfig(e.target.value)}
                                                        disabled={!isFirebaseEnabled}
                                                    ></textarea>
                                                    
                                                    <div className="flex gap-2">
                                                        <button 
                                                            onClick={() => {
                                                                if(firebaseConfig) alert('Firebase設定はブラウザに自動保存されています。\nこのままSync IDを入力して「上書き / 取得」を行ってください。');
                                                            }}
                                                            disabled={!isFirebaseEnabled || !firebaseConfig}
                                                            className="flex-1 bg-slate-800 text-white font-bold py-1.5 rounded shadow hover:bg-slate-700 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-[11px]"
                                                        >
                                                            保存確認
                                                        </button>
                                                        <button 
                                                            onClick={() => {
                                                                if(firebaseConfig && window.confirm('入力されたFirebase設定をクリアしますか？')) {
                                                                    setFirebaseConfig('');
                                                                }
                                                            }}
                                                            disabled={!isFirebaseEnabled || !firebaseConfig}
                                                            className="w-12 bg-slate-200 text-slate-700 font-bold py-1.5 rounded shadow hover:bg-slate-300 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-[11px]"
                                                        >
                                                            クリア
                                                        </button>
                                                    </div>
                                                </div>
                                            )}
                                        </div>

                                        {/* Cloud Sync (Sync ID) */}
                                        <div className="flex flex-col gap-2">
                                            <h4 className="font-bold text-slate-500 flex items-center gap-2 text-xs">
                                                <IconDatabase /> ☁️ Sync ID
                                            </h4>
                                            <input 
                                                type="text" 
                                                className={`w-full border p-2 rounded outline-none font-bold text-sm transition-colors ${isFirebaseEnabled ? 'border-slate-300 focus:border-blue-500 text-slate-700' : 'border-slate-200 bg-slate-50 text-slate-400 cursor-not-allowed'}`} 
                                                placeholder="myclass2A"
                                                value={syncId}
                                                onChange={e => setSyncId(e.target.value)}
                                                disabled={!isFirebaseEnabled}
                                            />
                                            <div className="flex gap-2">
                                                <button 
                                                    onClick={handleCloudSave}
                                                    disabled={!isFirebaseEnabled}
                                                    className="flex-1 bg-blue-50 text-blue-600 border border-blue-200 font-bold py-2 rounded flex items-center justify-center gap-1 hover:bg-blue-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-xs"
                                                >
                                                    <IconCloudUpload /> 上書き
                                                </button>
                                                <button 
                                                    onClick={handleCloudLoad}
                                                    disabled={!isFirebaseEnabled}
                                                    className="flex-1 bg-green-50 text-green-600 border border-green-200 font-bold py-2 rounded flex items-center justify-center gap-1 hover:bg-green-100 disabled:opacity-50 disabled:cursor-not-allowed transition-colors text-xs"
                                                >
                                                    <IconCloudDownload /> 取得
                                                </button>
                                            </div>
                                        </div>

                                        <hr className="border-slate-200" />

                                        {/* JSON Local Manage */}
                                        <div className="flex flex-col gap-2">
                                            <h4 className="font-bold text-slate-500 flex items-center gap-2 text-xs">
                                                <IconFileJson /> 🗄️ JSON管理
                                            </h4>
                                            <div className="flex gap-2">
                                                <button 
                                                    onClick={handleJsonExport} 
                                                    className="flex-1 border border-slate-300 text-slate-600 font-bold py-2 rounded flex items-center justify-center gap-1 hover:bg-slate-50 transition-colors text-xs bg-white"
                                                >
                                                    <IconDownload /> 保存
                                                </button>
                                                <label className="flex-1 border border-slate-300 text-slate-600 font-bold py-2 rounded flex items-center justify-center gap-1 hover:bg-slate-50 transition-colors cursor-pointer text-xs bg-white">
                                                    <IconUpload /> 読込
                                                    <input type="file" accept=".json" className="hidden" onChange={handleJsonImport} />
                                                </label>
                                            </div>
                                        </div>

                                    </div>
                                </div>
                                
                                {/* Settings Panel Overlay */}
                                {isSettingsOpen && (
                                    <div 
                                        className="absolute inset-0 bg-slate-900/20 backdrop-blur-sm z-40" 
                                        onClick={() => setIsSettingsOpen(false)}
                                    ></div>
                                )}
                            </div>
                        </div>

                        {/* --- PRINT MENU MODAL (v3.9) --- */}
                        {isPrintMenuOpen && (

                                        <button onClick={() => setIsPrintMenuOpen(false)} className="text-slate-400 hover:text-white p-1 rounded-full transition-colors"><IconX /></button>

                                    <div className="p-5 overflow-y-auto max-h-[80vh] bg-slate-50 flex flex-col gap-5">
                                        
                                        {/* 1. 出力項目の選択 */}

                                            <h4 className="font-bold text-slate-700 text-sm border-b border-slate-200 pb-1">1. 出力する試験の種別</h4>

                                                <label className="flex items-center gap-3 cursor-pointer p-2 border border-slate-200 bg-white rounded-lg hover:bg-blue-50 transition-colors shadow-sm">
                                                    <input type="checkbox" className="w-5 h-5 text-blue-600 rounded" checked={printConfig.types.regular} onChange={(e) => setPrintConfig({...printConfig, types: {...printConfig.types, regular: e.target.checked}})} />

                                                </label>
                                                <label className="flex items-center gap-3 cursor-pointer p-2 border border-slate-200 bg-white rounded-lg hover:bg-green-50 transition-colors shadow-sm">
                                                    <input type="checkbox" className="w-5 h-5 text-green-600 rounded" checked={printConfig.types.benesse} onChange={(e) => setPrintConfig({...printConfig, types: {...printConfig.types, benesse: e.target.checked}})} />
                                                    <span className="font-bold text-sm text-green-700">学力推移調査を含める</span>
                                                </label>
                                                <label className="flex items-center gap-3 cursor-pointer p-2 border border-slate-200 bg-white rounded-lg hover:bg-purple-50 transition-colors shadow-sm">
                                                    <input type="checkbox" className="w-5 h-5 text-purple-600 rounded" checked={printConfig.types.comprehensive} onChange={(e) => setPrintConfig({...printConfig, types: {...printConfig.types, comprehensive: e.target.checked}})} />
                                                    <span className="font-bold text-sm text-purple-700">学期総合を含める</span>
                                                </label>
                                            </div>
                                        </div>

                                        {/* 2. 折れ線グラフの印刷有無（一覧表と同じページに統合して1枚に収める） */}

                                            <h4 className="font-bold text-slate-700 text-sm border-b border-slate-200 pb-1">2. 折れ線グラフの印刷有無</h4>
                                            <div className="grid grid-cols-1 gap-2">
                                                <label className={`flex items-start gap-3 cursor-pointer p-2.5 border rounded-lg transition-colors ${printConfig.includeCharts ? 'bg-blue-50 border-blue-400 ring-1 ring-blue-400' : 'bg-white border-slate-200 hover:bg-slate-50'}`}>

                                                        type="radio"
                                                        name="printIncludeCharts"
                                                        className="w-4 h-4 mt-0.5 text-blue-600"
                                                        checked={printConfig.includeCharts}
                                                        onChange={() => setPrintConfig({...printConfig, includeCharts: true})}
                                                    />
                                                    <div>
                                                        <div className="font-bold text-sm text-slate-800">📈 一覧表とグラフをまとめて印刷（グラフあり）</div>
                                                        <div className="text-[11px] text-slate-500 mt-0.5">選んだ試験種別ごとに、一覧表と全教科の折れ線グラフを同じ1枚（A4縦）に収めて出力します</div>
                                                    </div>
                                                </label>
                                                <label className={`flex items-start gap-3 cursor-pointer p-2.5 border rounded-lg transition-colors ${!printConfig.includeCharts ? 'bg-emerald-50 border-emerald-400 ring-1 ring-emerald-400' : 'bg-white border-slate-200 hover:bg-slate-50'}`}>
                                                    <input
                                                        type="radio"
                                                        name="printIncludeCharts"
                                                        className="w-4 h-4 mt-0.5 text-emerald-600"
                                                        checked={!printConfig.includeCharts}
                                                        onChange={() => setPrintConfig({...printConfig, includeCharts: false})}
                                                    />
                                                    <div>
                                                        <div className="font-bold text-sm text-slate-800">📄 一覧表・サマリーのみ印刷（グラフなし）</div>

                                                    </div>
                                                </label>
                                            </div>
                                        </div>

                                        {/* 3. 出力対象の選択 */}

                                            <div className="flex flex-col gap-2">
                                                <label className={`flex items-center gap-3 cursor-pointer p-2.5 border rounded-lg transition-colors ${printConfig.mode === 'all' ? 'bg-blue-50 border-blue-300' : 'bg-white border-slate-200 hover:bg-slate-50'}`}>
                                                    <input type="radio" name="printMode" value="all" className="w-4 h-4" checked={printConfig.mode === 'all'} onChange={() => setPrintConfig({...printConfig, mode: 'all'})} />
                                                    <span className="font-bold text-sm text-slate-700">表示中の全員 ({tableData.length}名)</span>
                                                </label>
                                                
                                                <label className={`flex items-center gap-3 cursor-pointer p-2.5 border rounded-lg transition-colors ${printConfig.mode === 'class' ? 'bg-blue-50 border-blue-300' : 'bg-white border-slate-200 hover:bg-slate-50'}`}>
                                                    <input type="radio" name="printMode" value="class" className="w-4 h-4" checked={printConfig.mode === 'class'} onChange={() => setPrintConfig({...printConfig, mode: 'class', targetClass: printConfig.targetClass || availableClasses[0]})} />
                                                    <span className="font-bold text-sm text-slate-700">クラスで絞り込み</span>
                                                </label>
                                                
                                                {/* クラス選択UI */}

                                                    <div className="ml-8 flex flex-wrap gap-2">
                                                        {availableClasses.map(c => (
                                                            <button
                                                                key={c}
                                                                onClick={() => setPrintConfig({...printConfig, targetClass: c})}
                                                                className={`px-4 py-1.5 rounded-full text-sm font-bold transition-all ${printConfig.targetClass === c ? 'bg-blue-600 text-white shadow-md scale-105' : 'bg-white border border-slate-300 text-slate-600 hover:bg-slate-100'}`}
                                                            >
                                                                {c}組
                                                            </button>
                                                        ))}
                                                        {availableClasses.length === 0 && <span className="text-sm text-slate-500">クラス情報がありません</span>}
                                                    </div>
                                                )}

                                                <label className={`flex items-center gap-3 cursor-pointer p-2.5 border rounded-lg transition-colors ${printConfig.mode === 'individual' ? 'bg-blue-50 border-blue-300' : 'bg-white border-slate-200 hover:bg-slate-50'}`}>
                                                    <input type="radio" name="printMode" value="individual" className="w-4 h-4" checked={printConfig.mode === 'individual'} onChange={() => setPrintConfig({...printConfig, mode: 'individual'})} />
                                                    <span className="font-bold text-sm text-slate-700">生徒を個別に指定</span>
                                                </label>

                                                {/* 個人選択UI */}
                                                {printConfig.mode === 'individual' && (
                                                    <div className="ml-8 border border-slate-300 rounded-lg overflow-hidden bg-white shadow-inner">
                                                        <div className="bg-slate-100 px-3 py-2 flex justify-between items-center border-b border-slate-300 text-xs">
                                                            <span className="font-bold text-slate-700">{printConfig.selectedStudents.length}名 選択中</span>
                                                            <div className="flex gap-3">
                                                                <button onClick={() => setPrintConfig({...printConfig, selectedStudents: tableData.map(r=>r.studentId)})} className="text-blue-600 hover:text-blue-800 font-bold">全選択</button>
                                                                <button onClick={() => setPrintConfig({...printConfig, selectedStudents: []})} className="text-slate-500 hover:text-slate-700 font-bold">全解除</button>
                                                            </div>
                                                        </div>
                                                        <div className="max-h-48 overflow-y-auto p-2 flex flex-col gap-1">
                                                            {tableData.map(r => (
                                                                <label key={r.studentId} className="flex items-center gap-3 p-1.5 hover:bg-blue-50 rounded cursor-pointer transition-colors">
                                                                    <input 
                                                                        type="checkbox" 
                                                                        className="w-4 h-4 text-blue-600 rounded border-slate-300"
                                                                        checked={printConfig.selectedStudents.includes(r.studentId)}
                                                                        onChange={(e) => {
                                                                            const newSelected = e.target.checked 
                                                                                ? [...printConfig.selectedStudents, r.studentId]
                                                                                : printConfig.selectedStudents.filter(id => id !== r.studentId);
                                                                            setPrintConfig({...printConfig, selectedStudents: newSelected});
                                                                        }}
                                                                    />
                                                                    <span className="font-mono text-slate-400 text-xs">{r.grade}-{r.class}-{r.no.toString().padStart(2,'0')}</span>
                                                                    <span className="font-bold text-slate-700 text-sm">{r.rawName}</span>
                                                                </label>
                                                            ))}
                                                        </div>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    </div>
                                    <div className="p-4 bg-white border-t border-slate-200 flex justify-end gap-3 shrink-0">
                                        <button onClick={() => setIsPrintMenuOpen(false)} className="px-5 py-2.5 text-sm font-bold text-slate-600 bg-slate-100 hover:bg-slate-200 rounded-lg transition-colors">
                                            キャンセル
                                        </button>
                                        <button 
                                            onClick={executePrintFromSettings} 
                                            className="px-5 py-2.5 text-sm font-bold text-white bg-emerald-600 hover:bg-emerald-700 rounded-lg flex items-center gap-2 shadow-md transition-transform hover:scale-105"
                                        >
                                            <IconPrinter /> 出力プレビューを作成
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* --- RANKING TABLE MODAL (v4.3) --- */}
                        {isRankingOpen && selectedExamId && (
                            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center z-40 p-2 sm:p-4" onClick={() => setIsRankingOpen(false)}>
                                <div
                                    className="bg-white rounded-xl shadow-2xl w-full max-w-6xl max-h-[95vh] flex flex-col overflow-hidden"
                                    onClick={e => e.stopPropagation()}
                                >
                                    {/* Modal Header */}
                                    <div className="bg-slate-900 text-white px-4 py-3 sm:px-6 sm:py-4 flex flex-wrap justify-between items-center gap-3 shrink-0">
                                        <div className="flex items-center gap-3">
                                            <div className="w-10 h-10 bg-amber-500 text-slate-900 rounded-lg flex items-center justify-center font-extrabold shadow-inner shrink-0">
                                                <IconTrophy />
                                            </div>
                                            <div>
                                                <div className="flex items-center gap-2">
                                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded text-white ${activeTab === 'regular' ? 'bg-blue-500' : (activeTab === 'benesse' ? 'bg-green-500' : 'bg-purple-500')}`}>
                                                        {activeTab === 'regular' ? '定期試験' : (activeTab === 'benesse' ? '学力推移調査' : '学期総合')}
                                                    </span>
                                                    <span className="text-xs text-slate-400">1位〜20位 ランキング表</span>
                                                </div>
                                                <h2 className="text-lg sm:text-xl font-bold leading-tight mt-0.5">{selectedExamName}</h2>
                                            </div>
                                        </div>

                                        {/* クラス絞り込み ＆ 印刷ボタン */}
                                        <div className="flex flex-wrap items-center gap-2 ml-auto">
                                            {availableClasses.length > 1 && (
                                                <div className="flex items-center bg-slate-800 p-1 rounded-lg border border-slate-700">
                                                    <button
                                                        type="button"
                                                        onClick={() => setRankingClassFilter('ALL')}
                                                        className={`px-2.5 py-1 rounded text-xs font-bold transition-colors ${rankingClassFilter === 'ALL' ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-300 hover:text-white'}`}
                                                    >
                                                        学年全体
                                                    </button>
                                                    {availableClasses.map(c => (
                                                        <button
                                                            key={c}
                                                            type="button"
                                                            onClick={() => setRankingClassFilter(c)}
                                                            className={`px-2.5 py-1 rounded text-xs font-bold transition-colors ${rankingClassFilter === c ? 'bg-amber-500 text-slate-900 shadow' : 'text-slate-300 hover:text-white'}`}
                                                        >
                                                            {c}組のみ
                                                        </button>
                                                    ))}
                                                </div>
                                            )}

                                            <button
                                                type="button"
                                                onClick={triggerPrintRanking}
                                                className="text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2 px-3 rounded-lg border border-emerald-500 flex items-center gap-1.5 shadow-sm transition-colors"
                                            >
                                                <IconPrinter /> 掲示・配布用に印刷 / PDF出力
                                            </button>

                                            <button
                                                type="button"
                                                onClick={() => setIsRankingOpen(false)}
                                                className="text-slate-400 hover:text-white transition-colors bg-slate-800 p-2 rounded-full shrink-0"
                                            >
                                                <IconX />
                                            </button>
                                        </div>
                                    </div>

                                    {/* Modal Body */}
                                    <div className="p-4 sm:p-6 overflow-y-auto bg-slate-50 flex-1">
                                        {currentExamRankingSections.map(sec => (
                                            <RankingSectionView
                                                key={sec.id}
                                                section={sec}
                                                isPrint={false}
                                                onSelectStudent={(stuId) => {
                                                    setIsRankingOpen(false);
                                                    setSelectedStudentId(stuId);
                                                }}
                                            />
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Student Detail Modal (Normal Screen UI) */}
                        {selectedStudentId && comprehensiveReportData && (
                            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-40 p-2 sm:p-4" onClick={() => setSelectedStudentId(null)}>
                                <div 
                                    className="bg-white rounded-xl shadow-2xl w-full max-w-5xl max-h-[95vh] flex flex-col overflow-hidden" 
                                    onClick={e => e.stopPropagation()}
                                >
                                    {/* Modal Header */}
                                    <div className="bg-slate-800 text-white px-4 py-3 sm:px-6 sm:py-4 flex justify-between items-center shrink-0">
                                        <div className="flex items-center gap-1 sm:gap-2">
                                            <button 
                                                onClick={() => handleNavigateStudent('prev')} 
                                                className={`p-1 sm:p-2 rounded-full transition-colors shrink-0 ${tableData.findIndex(r => r.studentId === selectedStudentId) > 0 ? 'text-slate-300 hover:text-white hover:bg-slate-700/50' : 'text-slate-600 cursor-not-allowed'}`}
                                                disabled={tableData.findIndex(r => r.studentId === selectedStudentId) <= 0}
                                                title="前の生徒 (←)"
                                            >
                                                <IconChevronLeft />
                                            </button>

                                            <div className="flex items-center gap-3 sm:gap-4 mx-1 sm:mx-2 w-48 sm:w-72">
                                                <div className="w-10 h-10 sm:w-12 sm:h-12 bg-blue-500 rounded-full flex items-center justify-center text-lg sm:text-xl font-bold shadow-inner shrink-0">
                                                    {currentStudentName ? currentStudentName.charAt(0) : ''}
                                                </div>
                                                <div className="overflow-hidden">
                                                    <div className="flex items-center gap-2 mb-0.5 sm:mb-1">
                                                        <span className="text-[10px] text-slate-400 font-mono shrink-0 bg-slate-700 px-1.5 py-0.5 rounded">
                                                            {tableData.findIndex(r => r.studentId === selectedStudentId) + 1} / {tableData.length}
                                                        </span>
                                                    </div>
                                                    <h2 className="text-xl sm:text-2xl font-bold leading-none truncate">{currentStudentName}</h2>
                                                </div>
                                            </div>

                                            <button 
                                                onClick={() => handleNavigateStudent('next')} 
                                                className={`p-1 sm:p-2 rounded-full transition-colors shrink-0 ${tableData.findIndex(r => r.studentId === selectedStudentId) < tableData.length - 1 ? 'text-slate-300 hover:text-white hover:bg-slate-700/50' : 'text-slate-600 cursor-not-allowed'}`}
                                                disabled={tableData.findIndex(r => r.studentId === selectedStudentId) >= tableData.length - 1}
                                                title="次の生徒 (→)"
                                            >
                                                <IconChevronRight />
                                            </button>
                                        </div>
                                        <div className="flex items-center gap-2 sm:gap-3">
                                            <label className="hidden md:flex items-center gap-1.5 text-xs bg-slate-700/70 hover:bg-slate-700 px-2.5 py-1.5 rounded border border-slate-600 cursor-pointer select-none">
                                                <input
                                                    type="checkbox"
                                                    className="w-3.5 h-3.5 accent-blue-500 rounded"
                                                    checked={printConfig.includeCharts}
                                                    onChange={e => setPrintConfig({...printConfig, includeCharts: e.target.checked})}
                                                />
                                                <span className="font-bold text-slate-200">グラフも一緒に印刷</span>
                                            </label>
                                            <button 
                                                onClick={() => {
                                                    // 個人の場合は現在選択中のグラフ有無設定を使って出力
                                                    triggerPrint([selectedStudentId], printConfig.types, printConfig.includeCharts);
                                                }}
                                                className="hidden sm:flex text-xs bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-1.5 px-3 rounded border border-emerald-500 items-center gap-1 shadow-sm transition-colors"
                                            >
                                                <IconPrinter /> この生徒をPDF出力 ({printConfig.includeCharts ? 'グラフあり' : '表のみ'})
                                            </button>
                                            <button onClick={() => setSelectedStudentId(null)} className="text-slate-400 hover:text-white transition-colors bg-slate-700/50 p-1.5 sm:p-2 rounded-full shrink-0">
                                                <IconX />
                                            </button>
                                        </div>
                                    </div>

                                    {/* Modal Body */}
                                    <div className="p-4 sm:p-6 overflow-y-auto bg-slate-50 flex-1">
                                        {comprehensiveReportData.length === 0 ? (
                                            <div className="text-center text-slate-500 py-10">データがありません</div>
                                        ) : (
                                            comprehensiveReportData.map(section => (
                                                <ReportSection key={section.type} section={section} isPrint={false} />
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* --- PRINT ONLY TEMPLATE (Hides during normal viewing) --- */}
                    <div className="print-only">
                        {}
                        {isPrinting && printModeType === 'ranking' && currentExamRankingSections.map((sec) => {
                            // 20位タイが極めて多い場合（35行超など）のみ縮小し、通常時はA4縦1枚いっぱいに広げて表示
                            let maxRows = 20;
                            sec.columns.forEach(c => {
                                if (c.topList.length > maxRows) maxRows = c.topList.length;
                            });
                            const rowH = Math.max(24, Math.min(43, Math.floor((sec.isBenesse ? 830 : 845) / maxRows)));
                            const estimatedH = 155 + maxRows * rowH;
                            const targetMaxH = 1015;
                            const rankingZoom = estimatedH > targetMaxH
                                ? Math.max(0.65, Number((targetMaxH / estimatedH).toFixed(3)))
                                : 1;

                            return (
                                <div key={sec.id} className="print-sheet" style={{ zoom: rankingZoom }}>
                                    <RankingSectionView section={sec} isPrint={true} />
                                </div>
                            );
                        })}

                        {isPrinting && printModeType === 'report' && printTargetIds.map((targetStudentId) => {
                            const detailData = getComprehensiveStudentReport(targetStudentId);
                            if (!detailData || detailData.length === 0) return null;
                            
                            // 選択された試験種別だけをフィルター
                            const filteredData = detailData.filter(section => printTargetTypes[section.type]);
                            if (filteredData.length === 0) return null;

                            const studentName = filteredData[0].rawName;

                            // 実技教科が含まれるセクション（学期総合など）は、1枚目：主要5教科、2枚目：実技・9教科総合の2シートに分割する
                            const printSheets = [];
                            filteredData.forEach((section) => {
                                if (section.subSubjects && section.subSubjects.length > 0) {
                                    printSheets.push({
                                        key: `${targetStudentId}_${section.type}_main`,
                                        section,
                                        printPart: 'main',
                                        headerSubtitle: `${section.title} - 主要5教科`,
                                        subjects: section.mainSubjects,
                                        chartSubs: getChartSubjectsForTable(section.type, section.mainSubjects, 'main')
                                    });
                                    printSheets.push({
                                        key: `${targetStudentId}_${section.type}_sub`,
                                        section,
                                        printPart: 'sub',
                                        headerSubtitle: `${section.title} - 実技4教科・9教科総合`,
                                        subjects: section.subSubjects,
                                        chartSubs: getChartSubjectsForTable(section.type, section.subSubjects, 'sub')
                                    });
                                } else {
                                    printSheets.push({
                                        key: `${targetStudentId}_${section.type}_main`,
                                        section,
                                        printPart: 'main',
                                        headerSubtitle: section.title,
                                        subjects: section.mainSubjects,
                                        chartSubs: getChartSubjectsForTable(section.type, section.mainSubjects, 'main')
                                    });
                                }
                            });

                            return (
                                <React.Fragment key={targetStudentId}>
                                    {printSheets.map((sheet) => {
                                        const { section, printPart, headerSubtitle, subjects, chartSubs } = sheet;
                                        const totalSubs = subjects.length;
                                        const cardRows = Math.ceil(totalSubs / 5);
                                        const examCount = section.history.length;
                                        const chartCount = chartSubs.length > 0 ? 1 : 0;

                                        // グラフの有無・試験回数に応じてコンパクトレベルを自動決定
                                        let compactLevel = 'normal';
                                        if (printIncludeCharts) {
                                            if (examCount >= 9) {
                                                compactLevel = 'ultra';
                                            } else {
                                                compactLevel = 'compact';
                                            }
                                        } else {
                                            if (examCount >= 13) {
                                                compactLevel = 'ultra';
                                            } else if (examCount >= 9) {
                                                compactLevel = 'compact';
                                            } else {
                                                compactLevel = 'normal';
                                            }
                                        }

                                        // グラフのSVG高さを試験回数に応じて自動調整
                                        let printSvgHeight = 200;
                                        if (examCount <= 6) printSvgHeight = 225;
                                        else if (examCount <= 10) printSvgHeight = 195;
                                        else if (examCount <= 13) printSvgHeight = 175;
                                        else printSvgHeight = 160;

                                        // A4縦1枚（安全上限 900px）に必ず収まるようにコンテンツ高さを推定し、必要に応じてzoomを適用
                                        const cardRowH = compactLevel === 'ultra' ? 48 : (compactLevel === 'compact' ? 58 : 72);
                                        const rowH = compactLevel === 'ultra' ? 22 : (compactLevel === 'compact' ? 27 : 34);
                                        const tableBlockH = 48 + examCount * rowH;
                                        const chartBlockH = printIncludeCharts ? chartCount * (printSvgHeight + 44) : 0;
                                        const estimatedHeight = 42 + 28 + (cardRows * cardRowH) + tableBlockH + chartBlockH;

                                        const targetMaxH = 900;
                                        const sheetZoom = estimatedHeight > targetMaxH
                                            ? Math.max(0.55, Number((targetMaxH / estimatedHeight).toFixed(3)))
                                            : 1;

                                        return (
                                            <div key={sheet.key} className="print-sheet" style={{ zoom: sheetZoom }}>
                                                {/* Sheet Header */}
                                                <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: '8px', borderBottom: '2px solid #1e293b', paddingBottom: '5px' }}>
                                                    <div style={{ display: 'flex', alignItems: 'center' }}>
                                                        <div style={{ width: '30px', height: '30px', backgroundColor: '#3b82f6', borderRadius: '50%', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', fontSize: '15px', marginRight: '10px', WebkitPrintColorAdjust: 'exact' }}>
                                                            {studentName.charAt(0)}
                                                        </div>
                                                        <h2 style={{ fontSize: '20px', fontWeight: 'bold', margin: 0, color: '#0f172a' }}>
                                                            {studentName}
                                                            <span style={{ fontSize: '11px', fontWeight: 'normal', color: '#64748b', marginLeft: '10px' }}>
                                                                個人成績レポート（{headerSubtitle}）
                                                            </span>
                                                        </h2>
                                                    </div>
                                                </div>

                                                {/* Section Content (Stats + Table + Chart in the same sheet) */}
                                                <ReportSection
                                                    section={section}
                                                    isPrint={true}
                                                    printPart={printPart}
                                                    includeChartsInPrint={printIncludeCharts}
                                                    printSvgHeight={printSvgHeight}
                                                    compactLevel={compactLevel}
                                                />
                                            </div>
                                        );
                                    })}
                                </React.Fragment>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
