            // --- Data Processing for View ---
            
            const currentSubjects = useMemo(() => {
                if (!selectedExamId) return [];
                const examRecords = records.filter(r => r.examId === selectedExamId);
                const subjects = new Set();
                examRecords.forEach(r => {
                    Object.keys(r.scores).forEach(s => subjects.add(s));
                });
                
                const subArray = Array.from(subjects);
                
                subArray.sort((a, b) => {
                    const idxA = SUBJECT_ORDER.indexOf(a);
                    const idxB = SUBJECT_ORDER.indexOf(b);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.localeCompare(b);
                });

                return subArray;
            }, [records, selectedExamId]);

            const previousExamId = useMemo(() => {
                if (!selectedExamId || currentExams.length <= 1) return null;
                const idx = currentExams.findIndex(e => e.id === selectedExamId);
                if (idx <= 0) return null;
                return currentExams[idx - 1].id;
            }, [currentExams, selectedExamId]);

            const tableData = useMemo(() => {
                if (!selectedExamId) return [];
                
                const currentRecords = records.filter(r => r.examId === selectedExamId);
                let prevRecords = [];
                if (previousExamId) {
                    prevRecords = records.filter(r => r.examId === previousExamId);
                }

                const combined = currentRecords.map(curr => {
                    let prev = null;
                    for (let i = 0; i < prevRecords.length; i++) {
                        if (prevRecords[i].studentId === curr.studentId) {
                            prev = prevRecords[i];
                            break;
                        }
                    }
                    const diffs = {};
                    
                    currentSubjects.forEach(sub => {
                        const currentScore = curr.scores[sub];
                        if (prev && prev.scores[sub] !== undefined && currentScore !== undefined) {
                            diffs[sub] = currentScore - prev.scores[sub];
                        }
                    });

                    return {
                        ...curr,
                        prevScores: prev ? prev.scores : null,
                        diffs
                    };
                });

                return combined.sort((a, b) => {
                    let valA, valB;
                    
                    if (sortConfig.key === 'class_no') {
                        valA = `${a.grade}-${a.class}-${a.no.toString().padStart(3, '0')}`;
                        valB = `${b.grade}-${b.class}-${b.no.toString().padStart(3, '0')}`;
                    } else if (sortConfig.key === 'name') {
                        valA = a.studentId;
                        valB = b.studentId;
                    } else if (sortConfig.key === 'scholarship') {
                        const getRank = (val) => {
                            if (!val) return 99; 
                            if (val.includes('A') || val === '奨A') return 1;
                            if (val.includes('B') || val === '奨B') return 2;
                            if (val.includes('C') || val === '奨C') return 3;
                            return 4; 
                        };
                        valA = getRank(a.scholarship);
                        valB = getRank(b.scholarship);
                    } else if (sortConfig.key.startsWith('score_')) {
                        const subject = sortConfig.key.replace('score_', '');
                        if (sortConfig.direction === 'diff_desc' || sortConfig.direction === 'diff_asc') {
                            const diffA = a.diffs[subject];
                            const diffB = b.diffs[subject];
                            if (diffA === undefined && diffB !== undefined) return 1;
                            if (diffA !== undefined && diffB === undefined) return -1;
                            if (diffA === undefined && diffB === undefined) return 0;
                            valA = diffA;
                            valB = diffB;
                        } else {
                            valA = a.scores[subject] !== undefined && a.scores[subject] !== null ? a.scores[subject] : -9999;
                            valB = b.scores[subject] !== undefined && b.scores[subject] !== null ? b.scores[subject] : -9999;
                        }
                    }

                    if (valA < valB) return (sortConfig.direction === 'asc' || sortConfig.direction === 'diff_asc') ? -1 : 1;
                    if (valA > valB) return (sortConfig.direction === 'asc' || sortConfig.direction === 'diff_asc') ? 1 : -1;
                    return 0;
                });
            }, [records, selectedExamId, previousExamId, currentSubjects, sortConfig]);

            // 利用可能なクラスのリスト（印刷設定用）
            const availableClasses = useMemo(() => {
                const classes = new Set();
                tableData.forEach(r => {
                    if (r.class) classes.add(r.class);
                });
                return Array.from(classes).sort();
            }, [tableData]);

            const examineeCount = useMemo(() => {
                if (!selectedExamId) return 0;
                let foundExam = null;
                for (let i = 0; i < exams.length; i++) {
                    if (exams[i].id === selectedExamId) {
                        foundExam = exams[i];
                        break;
                    }
                }
                const isBenesse = foundExam && foundExam.type === 'benesse';
                const coreSubjects = isBenesse ? ['国語点数', '数学点数', '英語点数'] : ['国語', '社会', '数学', '理科', '英語'];
                const currentRecords = records.filter(r => r.examId === selectedExamId);
                return currentRecords.filter(r => {
                    return coreSubjects.every(sub => r.scores[sub] !== undefined && r.scores[sub] !== null);
                }).length;
            }, [records, selectedExamId, exams]);

            const averages = useMemo(() => {
                if (!selectedExamId) return {};
                const currentRecords = records.filter(r => r.examId === selectedExamId);
                
                const sums = {};
                const counts = {};
                
                currentSubjects.forEach(sub => {
                    sums[sub] = 0;
                    counts[sub] = 0;
                });

                currentRecords.forEach(r => {
                    currentSubjects.forEach(sub => {
                        const score = r.scores[sub];
                        if (score !== undefined && score !== null && !isNaN(score)) {
                            sums[sub] += Number(score);
                            counts[sub] += 1;
                        }
                    });
                });

                const avgs = {};
                currentSubjects.forEach(sub => {
                    if (counts[sub] > 0) {
                        avgs[sub] = sums[sub] / counts[sub];
                    } else {
                        avgs[sub] = null;
                    }
                });
                return avgs;
            }, [records, selectedExamId, currentSubjects]);

            // --- 個人表（統計サマリー）のデータ生成ロジック ---
            const getComprehensiveStudentReport = (studentId) => {
                const reportSections = [];
                const tabTypes = ['regular', 'benesse', 'comprehensive'];

                tabTypes.forEach(type => {
                    const typeExams = exams.filter(e => (e.type || 'regular') === type);
                    if (typeExams.length === 0) return;

                    const typeRecords = records.filter(r => typeExams.some(e => e.id === r.examId));
                    const subjectsSet = new Set();
                    typeRecords.filter(r => r.studentId === studentId).forEach(r => {
                        Object.keys(r.scores).forEach(s => subjectsSet.add(s));
                    });
                    
                    const subjectsArray = Array.from(subjectsSet).sort((a, b) => {
                        const idxA = SUBJECT_ORDER.indexOf(a);
                        const idxB = SUBJECT_ORDER.indexOf(b);
                        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                        if (idxA !== -1) return -1;
                        if (idxB !== -1) return 1;
                        return a.localeCompare(b);
                    });

                    if (subjectsArray.length === 0) return;

                    const mainSubjects = subjectsArray.filter(sub => !isSubSubject(sub));
                    const subSubjects = subjectsArray.filter(sub => isSubSubject(sub));

                    const history = typeExams.map(exam => {
                        let rec = null;
                        for(let i=0; i<typeRecords.length; i++){
                            if(typeRecords[i].examId === exam.id && typeRecords[i].studentId === studentId){
                                rec = typeRecords[i];
                                break;
                            }
                        }
                        return {
                            examId: exam.id,
                            examName: exam.name,
                            record: rec || null
                        };
                    });

                    const foundHistory = history.find(h => h.record && h.record.rawName);
                    const rawName = foundHistory ? foundHistory.record.rawName : studentId;
                    const stats = {};
                    history.forEach(h => {
                        if (h.record) {
                            Object.entries(h.record.scores).forEach(([sub, score]) => {
                                if (!stats[sub]) {
                                    stats[sub] = { max: score, min: score, sum: 0, count: 0 };
                                }
                                stats[sub].max = Math.max(stats[sub].max, score);
                                stats[sub].min = Math.min(stats[sub].min, score);
                                stats[sub].sum += score;
                                stats[sub].count += 1;
                            });
                        }
                    });

                    Object.keys(stats).forEach(sub => {
                        stats[sub].avg = (stats[sub].sum / stats[sub].count).toFixed(1);
                    });

                    let title = '定期試験';
                    let colorClass = 'bg-blue-500';
                    let titleColor = 'text-blue-800';
                    if (type === 'benesse') {
                        title = '学力推移調査';
                        colorClass = 'bg-green-500';
                        titleColor = 'text-green-800';
                    } else if (type === 'comprehensive') {
                        title = '学期総合';
                        colorClass = 'bg-purple-500';
                        titleColor = 'text-purple-800';
                    }

                    reportSections.push({
                        type,
                        title,
                        colorClass,
                        titleColor,
                        rawName,
                        mainSubjects,
                        subSubjects,
                        history,
                        stats
                    });
                });

                return reportSections;
            };

            const comprehensiveReportData = useMemo(() => {
                if (!selectedStudentId) return null;
                return getComprehensiveStudentReport(selectedStudentId);
            }, [selectedStudentId, exams, records]);

            const currentStudentName = comprehensiveReportData && comprehensiveReportData.length > 0 ? comprehensiveReportData[0].rawName : selectedStudentId;

            // --- Navigation Handler ---
            const handleNavigateStudent = (direction) => {
                if (!selectedStudentId || tableData.length === 0) return;
                
                const currentIndex = tableData.findIndex(r => r.studentId === selectedStudentId);
                if (currentIndex === -1) return;

                let nextIndex = currentIndex;
                if (direction === 'next' && currentIndex < tableData.length - 1) {
                    nextIndex = currentIndex + 1;
                } else if (direction === 'prev' && currentIndex > 0) {
                    nextIndex = currentIndex - 1;
                }
                
                if (nextIndex !== currentIndex) {
                    setSelectedStudentId(tableData[nextIndex].studentId);
                }
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (!selectedStudentId) return;
                    if (e.key === 'ArrowRight') {
                        handleNavigateStudent('next');
                    } else if (e.key === 'ArrowLeft') {
                        handleNavigateStudent('prev');
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedStudentId, tableData]);

            const handleTouchStart = (e) => {
                touchStartX.current = e.targetTouches[0].clientX;
            };

            const handleTouchMove = (e) => {
                touchEndX.current = e.targetTouches[0].clientX;
            };

            const handleTouchEnd = () => {
                if (!touchStartX.current || !touchEndX.current) return;
                const distance = touchStartX.current - touchEndX.current;
                
                if (distance > 50) {
                    handleNavigateStudent('next');
                } else if (distance < -50) {
                    handleNavigateStudent('prev');
                }
                
                touchStartX.current = null;
                touchEndX.current = null;
            };

            // --- CSV Export Handler ---
            const handleExportCurrentExamCSV = () => {
                if (!selectedExamId) return;
                const exam = exams.find(e => e.id === selectedExamId);
                if (!exam) return;

                if (tableData.length === 0) {
                    alert('出力するデータがありません。');
                    return;
                }

                const csvData = tableData.map(r => {
                    const row = {
                        '学年': r.grade,
                        '組': r.class,
                        '出席番号': r.no,
                        '氏名': r.rawName,
                        '学園奨学生': r.scholarship || ''
                    };
                    currentSubjects.forEach(sub => {
                        row[sub] = r.scores[sub] !== undefined ? r.scores[sub] : '';
                    });
                    return row;
                });

                const csvContent = Papa.unparse(csvData);
                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `${exam.name}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // --- Print PDF Handler ---
            const triggerPrint = (targetIds, typesConfig, includeChartsFlag = false) => {
                setPrintTargetIds(targetIds);
                setPrintTargetTypes(typesConfig);
                setPrintIncludeCharts(includeChartsFlag);
                setIsPrinting(true);
                setTimeout(() => {
                    if(targetIds.length > 1) alert("印刷プレビューが開きます。\n「送信先（プリンター）」を「PDFに保存」にして保存してください。");
                    window.print();
                    setIsPrinting(false);
                    setPrintTargetIds([]);
                }, 600);
            };

            const executePrintFromSettings = () => {
                let targets = [];
                if (printConfig.mode === 'all') {
                    targets = tableData.map(r => r.studentId);
                } else if (printConfig.mode === 'class') {
                    targets = tableData.filter(r => r.class === printConfig.targetClass).map(r => r.studentId);
                } else if (printConfig.mode === 'individual') {
                    targets = printConfig.selectedStudents;
                }

                if (targets.length === 0) {
                    alert('出力対象の生徒が選択されていません。');
                    return;
                }
                
                if (!printConfig.types.regular && !printConfig.types.benesse && !printConfig.types.comprehensive) {
                    alert('出力する試験種別を1つ以上選択してください。');
                    return;
                }

                setIsPrintMenuOpen(false);
                triggerPrint(targets, printConfig.types, printConfig.includeCharts);
            };


            // --- Render Helpers ---
            const renderDiffText = (diff, subjectName = '', extraClass = '') => {
                if (diff === undefined || diff === null || isNaN(diff)) return null;
                const isFloat = typeof subjectName === 'string' && (subjectName.includes('平均') || subjectName.includes('偏差値'));
                const isRank = typeof subjectName === 'string' && (subjectName.includes('席次') || subjectName.includes('順位'));
                let formattedDiff = isFloat ? Number(diff).toFixed(1) : Math.round(diff).toString();
                const diffNum = Number(formattedDiff);

                if (diffNum === 0) return <span className={`text-slate-400 ${extraClass}`}>(±0)</span>;

                if (diffNum > 0) {
                    return <span className={`font-medium ${isRank ? 'text-red-500' : 'text-green-600'} ${extraClass}`}>(+{formattedDiff})</span>;
                } else {
                    return <span className={`font-medium ${isRank ? 'text-green-600' : 'text-red-500'} ${extraClass}`}>({formattedDiff})</span>;
                }
            };

            const renderSortIcon = (key) => {
                if (sortConfig.key !== key) return <span className="text-gray-300 ml-1 text-[10px]">↕</span>;
                if (sortConfig.direction === 'asc') return <span className="text-blue-600 ml-1 text-[10px]" title="点数が小さい順">↑</span>;
                if (sortConfig.direction === 'desc') return <span className="text-blue-600 ml-1 text-[10px]" title="点数が大きい順">↓</span>;
                if (sortConfig.direction === 'diff_desc') return <span className="text-green-600 ml-1 text-[12px]" title="伸びた順">↗</span>;
                if (sortConfig.direction === 'diff_asc') return <span className="text-red-600 ml-1 text-[12px]" title="下がった順">↘</span>;
            };

            let selectedExamName = '';
            for(let i=0; i<currentExams.length; i++){
                if(currentExams[i].id === selectedExamId) {
                    selectedExamName = currentExams[i].name;
                    break;
                }
            }

            // --- Report Section Component (Reusable) ---
            const ReportSection = ({ section, isPrint, compactLevel = 'normal' }) => {
                if (!section) return null;

                const isUltraCompact = compactLevel === 'ultra';
                const isCompact = compactLevel === 'compact' || isUltraCompact;

                return (
                    <div className={`${isPrint ? (isCompact ? 'mb-2.5' : 'mb-4') : 'mb-8'} relative pl-3 sm:pl-4 border-l-2 border-slate-200`}>
                        <div className={`absolute -left-[9px] top-0 w-4 h-4 rounded-full ${section.colorClass} border-2 border-white flex items-center justify-center`}></div>
                        
                        <div className={`flex flex-wrap items-baseline justify-between gap-2 ${isCompact ? 'mb-1.5' : 'mb-2.5'}`}>
                            <h3 className={`${isCompact ? 'text-sm' : 'text-base sm:text-lg'} font-bold ${section.titleColor} flex items-center gap-2`}>
                                {section.title}
                                <span className="text-[11px] font-bold text-slate-600 bg-slate-200/80 px-2 py-0.5 rounded-full">
                                    全{section.history.filter(h=>h.record).length}回分の個人推移
                                </span>
                            </h3>
                            <span className="text-[10px] sm:text-xs font-bold text-slate-600 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded">
                                📊 各枠はこれまでの自分の<span className="text-slate-900 underline mx-0.5">過去平均</span>・<span className="text-red-700 mx-0.5">最高</span>・<span className="text-blue-700 mx-0.5">最低</span>の記録
                            </span>
                        </div>
                        
                        <div className={`stat-card-grid grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 ${isCompact ? 'gap-1.5 mb-2' : 'gap-2.5 mb-3'}`}>
                            {[...section.mainSubjects, ...section.subSubjects].map(sub => {
                                const stat = section.stats[sub];
                                if (!stat) return null;
                                const isFloat = typeof sub === 'string' && (sub.includes('平均') || sub.includes('偏差値'));
                                const displayAvg = isFloat ? Number(stat.avg).toFixed(1) : Math.round(stat.avg).toString();
                                const displayMax = isFloat ? Number(stat.max).toFixed(1) : Math.round(stat.max).toString();
                                const displayMin = isFloat ? Number(stat.min).toFixed(1) : Math.round(stat.min).toString();

                                return (
                                    <div key={sub} className={`${isCompact ? 'p-1.5' : 'p-2.5'} rounded-lg border border-slate-300 shadow-sm flex flex-col justify-between bg-white`}>
                                        <div className={`${isCompact ? 'text-[11px] mb-0.5 pb-0.5' : 'text-xs sm:text-[13px] mb-1 pb-1'} font-extrabold text-slate-800 border-b border-slate-200 truncate`} title={sub}>
                                            {sub}
                                        </div>
                                        <div className="flex justify-between items-baseline my-0.5 px-0.5">
                                            <span className="text-[10px] font-bold text-slate-600 whitespace-nowrap">過去平均</span>
                                            <span className={`${isCompact ? 'text-base' : 'text-lg sm:text-xl'} font-extrabold leading-none ${section.titleColor}`}>
                                                {displayAvg}
                                            </span>
                                        </div>
                                        <div className={`grid grid-cols-2 gap-1 ${isCompact ? 'mt-1 pt-1' : 'mt-1.5 pt-1.5'} border-t border-slate-100`}>
                                            <div className="bg-red-50 border border-red-200/80 px-1 py-0.5 rounded flex items-baseline justify-between whitespace-nowrap">
                                                <span className="text-[9.5px] font-bold text-red-700 shrink-0">最高</span>
                                                <span className={`${isCompact ? 'text-[11px]' : 'text-xs sm:text-[12.5px]'} font-extrabold text-red-700 ml-0.5`}>{displayMax}</span>
                                            </div>
                                            <div className="bg-blue-50 border border-blue-200/80 px-1 py-0.5 rounded flex items-baseline justify-between whitespace-nowrap">
                                                <span className="text-[9.5px] font-bold text-blue-700 shrink-0">最低</span>
                                                <span className={`${isCompact ? 'text-[11px]' : 'text-xs sm:text-[12.5px]'} font-extrabold text-blue-700 ml-0.5`}>{displayMin}</span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        <InteractiveReportTable
                            section={section}
                            subjects={section.mainSubjects}
                            titleSuffix={section.subSubjects.length > 0 ? "主要教科（5教科）" : ""}
                            tableType="main"
                            isPrint={isPrint}
                            compactLevel={compactLevel}
                            renderDiffText={renderDiffText}
                        />
                        <InteractiveReportTable
                            section={section}
                            subjects={section.subSubjects}
                            titleSuffix="実技・総合（4教科＋9教科平均）"
                            tableType="sub"
                            isPrint={isPrint}
                            compactLevel={compactLevel}
                            renderDiffText={renderDiffText}
                        />
                    </div>
                );
            };

            return (
                <div>
                    {/* --- MAIN UI (Hides during print) --- */}
                    <div className={isPrinting ? 'no-print' : 'flex flex-col h-screen overflow-hidden'}>
                        {/* Header */}
                        <header className="bg-slate-900 text-white p-3 sm:p-4 flex flex-wrap justify-between items-center shrink-0 relative z-40 gap-y-3">

                                </button>
                                <div className="bg-blue-600 p-2 rounded-lg shrink-0">

                                <h1 className="text-xl font-bold tracking-wider hidden sm:block whitespace-nowrap">BLEND 成績推移トラッカー <span className="text-sm font-normal text-slate-400 ml-2">v3.8</span></h1>
                            </div>
                            
                            {/* Settings Button & Clear Data */}
                            <div className="flex items-center gap-1 sm:gap-2 order-2 sm:order-3 ml-auto sm:ml-0 shrink-0">

                                    <IconSettings />
                                </button>
                                <button onClick={handleClearData} className="text-slate-400 hover:text-red-400 transition-colors p-2 rounded" title="全データクリア">
                                    <IconTrash />
                                </button>
                            </div>

                            {/* CSV Import Block */}
                            <div className="bg-slate-800 p-1.5 rounded-md flex items-center gap-1 sm:gap-2 border border-slate-700 w-full sm:w-auto order-3 sm:order-2">
                                <div className="relative shrink-0">
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); setIsDlMenuOpen(!isDlMenuOpen); }} 
                                        className="text-slate-300 hover:text-white text-[13px] py-1.5 px-2 sm:px-3 rounded flex items-center gap-1 transition-colors"
                                    >
                                        <IconDownload />
                                        <span className="hidden md:inline">フォーマットDL</span>
                                        <IconChevronDown />
                                    </button>
                                    {isDlMenuOpen && (
                                        <div className="absolute top-full left-0 mt-1 bg-white border border-slate-200 rounded shadow-xl z-50 overflow-hidden min-w-[160px]">
                                            <button 
                                                onClick={() => { handleDownloadSampleCSV('regular'); setIsDlMenuOpen(false); }}
                                                className="w-full text-left px-4 py-3 text-[13px] text-slate-700 hover:bg-blue-50 hover:text-blue-700 font-medium border-b border-slate-100"
                                            >
                                                📄 定期試験用 CSV
                                            </button>
                                            <button 
                                                onClick={() => { handleDownloadSampleCSV('comprehensive'); setIsDlMenuOpen(false); }}
                                                className="w-full text-left px-4 py-3 text-[13px] text-slate-700 hover:bg-blue-50 hover:text-blue-700 font-medium border-b border-slate-100"
                                            >
                                                📄 学期総合用 CSV
                                            </button>
                                            <button 
                                                onClick={() => { handleDownloadSampleCSV('benesse'); setIsDlMenuOpen(false); }}
                                                className="w-full text-left px-4 py-3 text-[13px] text-slate-700 hover:bg-blue-50 hover:text-blue-700 font-medium"
                                            >
                                                📄 学力推移調査用 CSV
                                            </button>
                                        </div>
                                    )}
                                </div>
                                <div className="w-px h-6 bg-slate-700 hidden sm:block mx-1"></div>
                                <input 
                                    type="text" 
                                    placeholder="試験名 (例: 2年1学期中間)" 
                                    className="bg-transparent text-[13px] px-2 py-1 outline-none text-white placeholder-slate-400 flex-1 min-w-[100px] sm:w-32 md:w-48"
                                    value={importExamName}
                                    onChange={(e) => setImportExamName(e.target.value)}
                                />
                                <label className="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white text-[13px] py-1.5 px-3 rounded flex items-center gap-1 transition-colors shrink-0">
                                    <IconUpload />
                                    <span>CSV読込</span>
                                    <input type="file" accept=".csv" className="hidden" ref={fileInputRef} onChange={handleImportCSV} />
                                </label>
                            </div>
                        </header>

                        {/* Main Content Area */}
                        <div className="flex flex-1 overflow-hidden relative">
                            
                            {/* Sidebar: Exam List & Tabs */}
                            <div className={`transition-all duration-300 ease-in-out ${isSidebarOpen ? 'w-56 border-r opacity-100' : 'w-0 border-r-0 opacity-0'} bg-white border-slate-200 flex flex-col shrink-0 z-10 overflow-hidden`}>
                                <div className="w-56 flex flex-col h-full">
                                    <div className="flex border-b border-slate-200 bg-slate-50 flex-wrap">
                                        <button 
                                            className={`flex-1 py-2 px-1 text-[11px] font-bold transition-colors ${activeTab === 'regular' ? 'text-blue-600 border-b-2 border-blue-600 bg-white' : 'text-slate-500 hover:bg-slate-100'}`}
                                            onClick={() => setActiveTab('regular')}
                                        >
                                            定期試験
                                        </button>
                                        <button 
                                            className={`flex-1 py-2 px-1 text-[11px] font-bold transition-colors ${activeTab === 'benesse' ? 'text-blue-600 border-b-2 border-blue-600 bg-white' : 'text-slate-500 hover:bg-slate-100'}`}
                                            onClick={() => setActiveTab('benesse')}

                                            学力推移
                                        </button>
                                        <button 
                                            className={`flex-1 py-2 px-1 text-[11px] font-bold transition-colors ${activeTab === 'comprehensive' ? 'text-blue-600 border-b-2 border-blue-600 bg-white' : 'text-slate-500 hover:bg-slate-100'}`}

                                    <div className="flex-1 overflow-y-auto bg-slate-50/30">
                                        {currentExams.length === 0 ? (
                                            <div className="p-8 text-center text-[13px] text-slate-400">

                                            </div>
                                        ) : (
                                            <ul className="divide-y divide-slate-100">
                                                {currentExams.map((exam, idx) => (
                                                    <li key={exam.id} className={`group flex justify-between items-center p-3 cursor-pointer transition-colors ${selectedExamId === exam.id ? 'bg-blue-50 border-l-4 border-blue-600' : 'hover:bg-slate-100 border-l-4 border-transparent'}`} onClick={() => setSelectedExamId(exam.id)}>
                                                        <div>

                                                        <button onClick={(e) => { e.stopPropagation(); handleDeleteExam(exam.id); }} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1">

                                    </div>
                                </div>
                            </div>

                            {/* Main Table Area */}
                            <div className="flex-1 flex flex-col bg-slate-50 relative overflow-hidden">
                                {selectedExamId && currentExams.length > 0 ? (
                                    <>
                                        <div className="p-4 bg-white border-b border-slate-200 flex justify-between items-end shrink-0">
                                            <div>
                                                <div className="flex items-center gap-2">
                                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded text-white ${activeTab === 'regular' ? 'bg-blue-500' : (activeTab === 'benesse' ? 'bg-green-500' : 'bg-purple-500')}`}>
                                                        {activeTab === 'regular' ? '定期試験' : (activeTab === 'benesse' ? '学力推移' : '学期総合')}
                                                    </span>
                                                    <h2 className="text-xl font-bold text-slate-800">{selectedExamName}</h2>
                                                </div>
                                                <p className="text-xs text-slate-500 mt-1">
                                                    生徒数: <span className="font-semibold">{tableData.length}</span>名 <span className="mx-2">|</span> 
                                                    主要教科受験者数: <span className="font-semibold">{examineeCount}</span>名 <span className="mx-2">|</span> 
                                                    {previousExamId ? '前回比較あり' : '初回データ'}
                                                </p>
                                            </div>
                                            <div className="flex items-center gap-2">
                                                <label className="cursor-pointer text-xs bg-white hover:bg-slate-50 text-slate-600 font-medium py-1.5 px-2 rounded border border-slate-300 flex items-center gap-1 shadow-sm transition-colors">
                                                    <IconUpload /> 試験をCSVで上書き
                                                    <input type="file" accept=".csv" className="hidden" onChange={handleUpdateCSV} />
                                                </label>
                                                <button 
                                                    onClick={handleExportCurrentExamCSV}
                                                    className="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-1.5 px-2 rounded border border-blue-200 flex items-center gap-1 shadow-sm transition-colors"
                                                >
                                                    <IconDownload /> 表示順でCSV保存
                                                </button>
                                                {/* NEW: PDF Print Settings Button */}
                                                <button 
                                                    onClick={() => {
                                                        // 設定メニューを開く前に、初期値として現在表示中の生徒一覧を全選択状態にしておく
                                                        setPrintConfig(prev => ({...prev, selectedStudents: tableData.map(r => r.studentId)}));
                                                        setIsPrintMenuOpen(true);
                                                    }}
                                                    className="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold py-1.5 px-2 rounded border border-emerald-200 flex items-center gap-1 shadow-sm transition-colors"
                                                >
                                                    <IconPrinter /> PDF/印刷出力設定
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <div className="flex-1 overflow-auto relative z-0 pb-2">
                                            <table className="w-full text-xs text-left whitespace-nowrap bg-white border-separate border-spacing-0">
                                                <thead className="text-[11px] text-slate-600 uppercase bg-slate-100 shadow-sm">
                                                    <tr>
                                                        <th className="px-2 py-2 sticky left-0 top-0 bg-slate-100 border-b border-slate-200 min-w-[32px] w-[32px] text-center text-slate-400 z-40">
                                                            #
                                                        </th>
                                                        <th className="px-2 py-2 sticky left-[32px] top-0 bg-slate-100 cursor-pointer hover:bg-slate-200 border-b border-slate-200 min-w-[90px] w-[90px] z-40" onClick={() => handleSort('class_no')}>
                                                            クラス/番号 {renderSortIcon('class_no')}
                                                        </th>
                                                        <th className="px-2 py-2 sticky left-[122px] top-0 bg-slate-100 cursor-pointer hover:bg-slate-200 border-b border-slate-200 min-w-[120px] w-[120px] shadow-[2px_0_5px_rgba(0,0,0,0.05)] z-40" onClick={() => handleSort('name')}>
                                                            氏名 {renderSortIcon('name')}
                                                        </th>
                                                        <th className="px-1 py-2 sticky top-0 bg-slate-100 cursor-pointer hover:bg-slate-200 border-b border-slate-200 min-w-[48px] w-[48px] text-center whitespace-nowrap z-30" onClick={() => handleSort('scholarship')}>

                                                        </th>
                                                        {currentSubjects.map(sub => (

                                                        <th className="w-full sticky top-0 bg-slate-100 border-b border-slate-200 z-30"></th>

                                                <IconPrinter /> この生徒をPDF出力 ({printConfig.includeCharts ? '2枚' : '1枚'})
                                            </button>
                                            <button onClick={() => setSelectedStudentId(null)} className="text-slate-400 hover:text-white transition-colors bg-slate-700/50 p-1.5 sm:p-2 rounded-full shrink-0">
                                                <IconX />
                                            </button>
                                        </div>
                                    </div>

                                    {/* Modal Body */}
                                    <div className="p-4 sm:p-6 overflow-y-auto bg-slate-50 flex-1">
                                        {comprehensiveReportData.length === 0 ? (
                                            <div className="text-center text-slate-500 py-10">データがありません</div>
                                        ) : (
                                            comprehensiveReportData.map(section => (
                                                <ReportSection key={section.type} section={section} isPrint={false} />
                                            ))
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* --- PRINT ONLY TEMPLATE (Hides during normal viewing) --- */}
                    <div className="print-only">
                        {isPrinting && printTargetIds.map((targetStudentId) => {
                            const detailData = getComprehensiveStudentReport(targetStudentId);
                            if (!detailData || detailData.length === 0) return null;
                            
                            // 選択された試験種別だけをフィルター
                            const filteredData = detailData.filter(section => printTargetTypes[section.type]);
                            if (filteredData.length === 0) return null;

                            const studentName = filteredData[0].rawName;

                            // 1ページ目（表＋サマリー）が必ず1枚に収まるよう、試験回数やセクション数から密度と縮小率を自動計算
                            let totalTableRows = 0;
                            let totalCardRows = 0;
                            let totalTables = 0;
                            filteredData.forEach(sec => {
                                const totalSubs = sec.mainSubjects.length + sec.subSubjects.length;
                                totalCardRows += Math.ceil(totalSubs / 5);
                                totalTables += 1;
                                totalTableRows += sec.history.length;
                                if (sec.subSubjects.length > 0) {
                                    totalTables += 1;
                                    totalTableRows += sec.history.length;
                                }
                            });

                            const compactLevel = (totalTableRows >= 13 || filteredData.length >= 2)
                                ? 'ultra'
                                : (totalTableRows >= 9 ? 'compact' : 'normal');

                            // A4縦1ページ（約980px相当）に対する推定高さを計算し、超える場合はzoomで自動縮小して確実に1ページへ収める
                            const rowH = compactLevel === 'ultra' ? 25 : (compactLevel === 'compact' ? 29 : 35);
                            const cardRowH = compactLevel === 'normal' ? 76 : 58;
                            const estimatedPage1Height = 46 + (filteredData.length * 30) + (totalCardRows * cardRowH) + (totalTables * 34) + (totalTableRows * rowH);
                            const page1Zoom = estimatedPage1Height > 960 ? Math.max(0.55, Number((960 / estimatedPage1Height).toFixed(3))) : 1;

                            // 2ページ目（グラフページ）用のチャート一覧を構築
                            const chartBlocks = [];
                            if (printIncludeCharts) {
                                filteredData.forEach(sec => {
                                    const mainChartSubs = getChartSubjectsForTable(sec.type, sec.mainSubjects, 'main');
                                    if (mainChartSubs.length > 0) {
                                        chartBlocks.push({
                                            key: `${sec.type}_main`,
                                            sectionTitle: sec.title,
                                            subTitle: sec.subSubjects.length > 0 ? '主要教科（5教科＋平均点）' : (sec.type === 'benesse' ? '偏差値推移（各教科＋3教科）' : '各教科＋5教科平均点'),
                                            colorClass: sec.colorClass,
                                            titleColor: sec.titleColor,
                                            history: sec.history,
                                            chartSubjects: mainChartSubs,
                                            isDeviation: sec.type === 'benesse'
                                        });
                                    }
                                    const subChartSubs = getChartSubjectsForTable(sec.type, sec.subSubjects, 'sub');
                                    if (subChartSubs.length > 0) {
                                        chartBlocks.push({
                                            key: `${sec.type}_sub`,
                                            sectionTitle: sec.title,
                                            subTitle: '実技4教科＋9教科平均点',
                                            colorClass: sec.colorClass,
                                            titleColor: sec.titleColor,
                                            history: sec.history,
                                            chartSubjects: subChartSubs,
                                            isDeviation: false
                                        });
                                    }
                                });
                            }

                            // 2ページ目のグラフ数に応じてSVGの高さと縮小率を自動調整（必ず2ページ目1枚に収める）
                            const chartCount = chartBlocks.length;
                            const printSvgHeight = chartCount <= 1 ? 310 : (chartCount === 2 ? 245 : (chartCount === 3 ? 195 : 165));
                            const estimatedPage2Height = 46 + chartCount * (printSvgHeight + 70);
                            const page2Zoom = estimatedPage2Height > 960 ? Math.max(0.6, Number((960 / estimatedPage2Height).toFixed(3))) : 1;

                            return (
                                <React.Fragment key={targetStudentId}>
                                    {/* ===== 1ページ目：名前 ＋ 過去平均(最高/最低) ＋ 各試験の点数表 ===== */}
                                    <div className="print-sheet" style={{ zoom: page1Zoom }}>
                                        {/* Header */}
                                        <div style={{ display: 'flex', alignItems: 'center', marginBottom: '10px', borderBottom: '2px solid #1e293b', paddingBottom: '6px' }}>
                                            <div style={{ width: '32px', height: '32px', backgroundColor: '#3b82f6', borderRadius: '50%', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', fontSize: '16px', marginRight: '10px', WebkitPrintColorAdjust: 'exact' }}>
                                                {studentName.charAt(0)}
                                            </div>
                                            <h2 style={{ fontSize: '21px', fontWeight: 'bold', margin: 0, color: '#0f172a' }}>
                                                {studentName}
                                                <span style={{ fontSize: '11px', fontWeight: 'normal', color: '#64748b', marginLeft: '10px' }}>個人成績 統合レポート</span>
                                            </h2>
                                        </div>

                                        {/* Sections (Tables & Stats Only) */}
                                        {filteredData.map(section => (
                                            <ReportSection
                                                key={section.type}
                                                section={section}
                                                isPrint={true}
                                                compactLevel={compactLevel}
                                            />
                                        ))}
                                    </div>

                                    {/* ===== 2ページ目：全教科表示の折れ線グラフ（グラフ印刷ONのときのみ出力） ===== */}
                                    {printIncludeCharts && chartBlocks.length > 0 && (
                                        <div className="print-sheet" style={{ zoom: page2Zoom }}>
                                            {/* Page 2 Header */}
                                            <div style={{ display: 'flex', alignItems: 'center', marginBottom: '10px', borderBottom: '2px solid #1e293b', paddingBottom: '6px' }}>
                                                <div style={{ width: '32px', height: '32px', backgroundColor: '#3b82f6', borderRadius: '50%', color: 'white', display: 'flex', alignItems: 'center', justifyContent: 'center', fontWeight: 'bold', fontSize: '16px', marginRight: '10px', WebkitPrintColorAdjust: 'exact' }}>
                                                    {studentName.charAt(0)}
                                                </div>
                                                <h2 style={{ fontSize: '21px', fontWeight: 'bold', margin: 0, color: '#0f172a' }}>
                                                    {studentName}
                                                    <span style={{ fontSize: '11px', fontWeight: 'normal', color: '#64748b', marginLeft: '10px' }}>個人成績 推移グラフ（全教科表示）</span>
                                                </h2>
                                            </div>

                                            {/* Charts */}
                                            <div className="flex flex-col gap-3">
                                                {chartBlocks.map(cb => (
                                                    <div key={cb.key} className="border border-slate-300 rounded-lg overflow-hidden bg-white">
                                                        <div className="bg-slate-100 px-3 py-1.5 border-b border-slate-200 flex items-center justify-between">
                                                            <div className="flex items-center gap-2">
                                                                <span className={`w-3 h-3 rounded-full ${cb.colorClass}`}></span>
                                                                <span className={`font-bold text-sm ${cb.titleColor}`}>{cb.sectionTitle}</span>
                                                                <span className="text-xs font-bold text-slate-600">— {cb.subTitle}</span>
                                                            </div>
                                                            <span className="text-[10px] font-bold text-slate-500">
                                                                ※太い点線は{cb.isDeviation ? '3教科偏差値' : '平均点'}
                                                            </span>
                                                        </div>
                                                        <SubjectLineChart
                                                            history={cb.history}
                                                            chartSubjects={cb.chartSubjects}
                                                            isDeviation={cb.isDeviation}
                                                            forceAllSubjects={true}
                                                            isPrint={true}
                                                            customSvgHeight={printSvgHeight}
                                                        />
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                </React.Fragment>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
