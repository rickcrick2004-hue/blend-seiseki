            const handleSort = (key) => {
                if (key.startsWith('score_')) {
                    if (sortConfig.key === key) {
                        if (sortConfig.direction === 'desc') setSortConfig({ key, direction: 'asc' });
                        else if (sortConfig.direction === 'asc') setSortConfig({ key, direction: 'diff_desc' });
                        else if (sortConfig.direction === 'diff_desc') setSortConfig({ key, direction: 'diff_asc' });
                        else setSortConfig({ key, direction: 'desc' });
                    } else {
                        setSortConfig({ key, direction: 'desc' }); // 初期は大きい順
                    }
                } else {
                    let direction = 'asc';
                    if (sortConfig.key === key && sortConfig.direction === 'asc') {
                        direction = 'desc';
                    }
                    setSortConfig({ key, direction });
                }
            };

            // --- Sync Handlers (Firebase & JSON) ---

            const getFirebaseDb = () => {
                if (!firebaseConfig.trim()) throw new Error('Firebase設定が入力されていません。');
                let configObj;
                try {
                    let str = firebaseConfig.trim();
                    if (str.includes('const firebaseConfig') || str.includes('=')) {
                        str = str.substring(str.indexOf('{'), str.lastIndexOf('}') + 1);
                    }
                    configObj = new Function("return " + str)();
                } catch (e) {
                    throw new Error('設定の形式が不正です。 { から } までのすべての内容が含まれているか確認してください。');
                }

                if (!configObj || !configObj.apiKey || !configObj.projectId) {
                    throw new Error('設定に必要な情報 (apiKey や projectId) が不足しています。全体をコピーできているか確認してください。');
                }

                if (!firebase.apps.length) {
                    firebase.initializeApp(configObj);
                } else {
                    const currentConfig = firebase.app().options;
                    if (currentConfig.projectId !== configObj.projectId) {
                        throw new Error('設定が変更されました。ページをリロードして再試行してください。');
                    }
                }
                return firebase.firestore();
            };

            const handleCloudSave = async () => {
                if (!syncId.trim()) return alert('Sync IDを入力してください。');
                try {
                    const db = getFirebaseDb();
                    await db.collection('blend_sync_data').doc(syncId).set({
                        exams,
                        records,
                        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    alert(`Sync ID: [${syncId}] にデータを保存(上書き)しました。`);
                } catch (error) {
                    console.error(error);
                    alert('保存に失敗しました。\n\n詳細: ' + error.message);
                }
            };

            const handleCloudLoad = async () => {
                if (!syncId.trim()) return alert('Sync IDを入力してください。');
                if (!window.confirm('現在のデータはクラウド上のデータで上書きされます。よろしいですか？')) return;
                try {
                    const db = getFirebaseDb();
                    const doc = await db.collection('blend_sync_data').doc(syncId).get();
                    if (doc.exists) {
                        const data = doc.data();
                        setExams(data.exams || []);
                        
                        setRecords(migrateRecords(data.records || []));
                        
                        alert('クラウドからデータを取得しました。');
                    } else {
                        alert('指定されたSync IDのデータが見つかりません。');
                    }
                } catch (error) {
                    console.error(error);
                    alert('取得に失敗しました。\n\n詳細: ' + error.message);
                }
            };

            const handleJsonExport = () => {
                const data = { exams, records };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `blend_data_${new Date().toISOString().slice(0,10)}.json`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const handleJsonImport = (e) => {
                const file = e.target.files[0];
                if (!file) return;
                if (!window.confirm('現在のデータは読み込んだデータで上書きされます。よろしいですか？')) {
                    e.target.value = '';
                    return;
                }
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.exams !== undefined && data.records !== undefined) {
                            setExams(data.exams.map(ex => ({...ex, type: ex.type || 'regular'})));
                            setRecords(migrateRecords(data.records));
                            alert('JSONファイルからデータを復元しました。');
                        } else {
                            alert('未対応のJSONフォーマットです。');
                        }
                    } catch (error) {
                        alert('JSONファイルの読み込みに失敗しました。');
                    }
                    e.target.value = ''; 
                };
                reader.readAsText(file);
            };

            // --- Data Processing for View ---
            
            const currentSubjects = useMemo(() => {
                if (!selectedExamId) return [];
                const examRecords = records.filter(r => r.examId === selectedExamId);
                const subjects = new Set();
                examRecords.forEach(r => {
                    Object.keys(r.scores).forEach(s => subjects.add(s));
                });
                
                const subArray = Array.from(subjects);
                
                subArray.sort((a, b) => {
                    const idxA = SUBJECT_ORDER.indexOf(a);
                    const idxB = SUBJECT_ORDER.indexOf(b);
                    if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                    if (idxA !== -1) return -1;
                    if (idxB !== -1) return 1;
                    return a.localeCompare(b);
                });

                return subArray;
            }, [records, selectedExamId]);

            const previousExamId = useMemo(() => {
                if (!selectedExamId || currentExams.length <= 1) return null;
                const idx = currentExams.findIndex(e => e.id === selectedExamId);
                if (idx <= 0) return null;
                return currentExams[idx - 1].id;
            }, [currentExams, selectedExamId]);

            const tableData = useMemo(() => {
                if (!selectedExamId) return [];
                
                const currentRecords = records.filter(r => r.examId === selectedExamId);
                let prevRecords = [];
                if (previousExamId) {
                    prevRecords = records.filter(r => r.examId === previousExamId);
                }

                const combined = currentRecords.map(curr => {
                    let prev = null;
                    for (let i = 0; i < prevRecords.length; i++) {
                        if (prevRecords[i].studentId === curr.studentId) {
                            prev = prevRecords[i];
                            break;
                        }
                    }
                    const diffs = {};
                    
                    currentSubjects.forEach(sub => {
                        const currentScore = curr.scores[sub];
                        if (prev && prev.scores[sub] !== undefined && currentScore !== undefined) {
                            diffs[sub] = currentScore - prev.scores[sub];
                        }
                    });

                    return {
                        ...curr,
                        prevScores: prev ? prev.scores : null,
                        diffs
                    };
                });

                return combined.sort((a, b) => {
                    let valA, valB;
                    
                    if (sortConfig.key === 'class_no') {
                        valA = `${a.grade}-${a.class}-${a.no.toString().padStart(3, '0')}`;
                        valB = `${b.grade}-${b.class}-${b.no.toString().padStart(3, '0')}`;
                    } else if (sortConfig.key === 'name') {
                        valA = a.studentId;
                        valB = b.studentId;
                    } else if (sortConfig.key === 'scholarship') {
                        const getRank = (val) => {
                            if (!val) return 99; 
                            if (val.includes('A') || val === '奨A') return 1;
                            if (val.includes('B') || val === '奨B') return 2;
                            if (val.includes('C') || val === '奨C') return 3;
                            return 4; 
                        };
                        valA = getRank(a.scholarship);
                        valB = getRank(b.scholarship);
                    } else if (sortConfig.key.startsWith('score_')) {
                        const subject = sortConfig.key.replace('score_', '');
                        if (sortConfig.direction === 'diff_desc' || sortConfig.direction === 'diff_asc') {
                            const diffA = a.diffs[subject];
                            const diffB = b.diffs[subject];
                            if (diffA === undefined && diffB !== undefined) return 1;
                            if (diffA !== undefined && diffB === undefined) return -1;
                            if (diffA === undefined && diffB === undefined) return 0;
                            valA = diffA;
                            valB = diffB;
                        } else {
                            valA = a.scores[subject] !== undefined && a.scores[subject] !== null ? a.scores[subject] : -9999;
                            valB = b.scores[subject] !== undefined && b.scores[subject] !== null ? b.scores[subject] : -9999;
                        }
                    }

                    if (valA < valB) return (sortConfig.direction === 'asc' || sortConfig.direction === 'diff_asc') ? -1 : 1;
                    if (valA > valB) return (sortConfig.direction === 'asc' || sortConfig.direction === 'diff_asc') ? 1 : -1;
                    return 0;
                });
            }, [records, selectedExamId, previousExamId, currentSubjects, sortConfig]);

            // 利用可能なクラスのリスト（印刷設定用）
            const availableClasses = useMemo(() => {
                const classes = new Set();
                tableData.forEach(r => {
                    if (r.class) classes.add(r.class);
                });
                return Array.from(classes).sort();
            }, [tableData]);

            const examineeCount = useMemo(() => {
                if (!selectedExamId) return 0;
                let foundExam = null;
                for (let i = 0; i < exams.length; i++) {
                    if (exams[i].id === selectedExamId) {
                        foundExam = exams[i];
                        break;
                    }
                }
                const isBenesse = foundExam && foundExam.type === 'benesse';
                const coreSubjects = isBenesse ? ['国語点数', '数学点数', '英語点数'] : ['国語', '社会', '数学', '理科', '英語'];
                const currentRecords = records.filter(r => r.examId === selectedExamId);
                return currentRecords.filter(r => {
                    return coreSubjects.every(sub => r.scores[sub] !== undefined && r.scores[sub] !== null);
                }).length;
            }, [records, selectedExamId, exams]);

            const averages = useMemo(() => {
                if (!selectedExamId) return {};
                const currentRecords = records.filter(r => r.examId === selectedExamId);
                
                const sums = {};
                const counts = {};
                
                currentSubjects.forEach(sub => {
                    sums[sub] = 0;
                    counts[sub] = 0;
                });

                currentRecords.forEach(r => {
                    currentSubjects.forEach(sub => {
                        const score = r.scores[sub];
                        if (score !== undefined && score !== null && !isNaN(score)) {
                            sums[sub] += Number(score);
                            counts[sub] += 1;
                        }
                    });
                });

                const avgs = {};
                currentSubjects.forEach(sub => {
                    if (counts[sub] > 0) {
                        avgs[sub] = sums[sub] / counts[sub];
                    } else {
                        avgs[sub] = null;
                    }
                });
                return avgs;
            }, [records, selectedExamId, currentSubjects]);

            // --- 個人表（統計サマリー）のデータ生成ロジック ---
            const getComprehensiveStudentReport = (studentId) => {
                const reportSections = [];
                const tabTypes = ['regular', 'benesse', 'comprehensive'];

                tabTypes.forEach(type => {
                    const typeExams = exams.filter(e => (e.type || 'regular') === type);
                    if (typeExams.length === 0) return;

                    const typeRecords = records.filter(r => typeExams.some(e => e.id === r.examId));
                    const subjectsSet = new Set();
                    typeRecords.filter(r => r.studentId === studentId).forEach(r => {
                        Object.keys(r.scores).forEach(s => subjectsSet.add(s));
                    });
                    
                    const subjectsArray = Array.from(subjectsSet).sort((a, b) => {
                        const idxA = SUBJECT_ORDER.indexOf(a);
                        const idxB = SUBJECT_ORDER.indexOf(b);
                        if (idxA !== -1 && idxB !== -1) return idxA - idxB;
                        if (idxA !== -1) return -1;
                        if (idxB !== -1) return 1;
                        return a.localeCompare(b);
                    });

                    if (subjectsArray.length === 0) return;

                    const mainSubjects = subjectsArray.filter(sub => !isSubSubject(sub));
                    const subSubjects = subjectsArray.filter(sub => isSubSubject(sub));

                    const history = typeExams.map(exam => {
                        let rec = null;
                        for(let i=0; i<typeRecords.length; i++){
                            if(typeRecords[i].examId === exam.id && typeRecords[i].studentId === studentId){
                                rec = typeRecords[i];
                                break;
                            }
                        }
                        return {
                            examId: exam.id,
                            examName: exam.name,
                            record: rec || null
                        };
                    });

                    const foundHistory = history.find(h => h.record && h.record.rawName);
                    const rawName = foundHistory ? foundHistory.record.rawName : studentId;
                    const stats = {};
                    history.forEach(h => {
                        if (h.record) {
                            Object.entries(h.record.scores).forEach(([sub, score]) => {
                                if (!stats[sub]) {
                                    stats[sub] = { max: score, min: score, sum: 0, count: 0 };
                                }
                                stats[sub].max = Math.max(stats[sub].max, score);
                                stats[sub].min = Math.min(stats[sub].min, score);
                                stats[sub].sum += score;
                                stats[sub].count += 1;
                            });
                        }
                    });

                    Object.keys(stats).forEach(sub => {
                        stats[sub].avg = (stats[sub].sum / stats[sub].count).toFixed(1);
                    });

                    let title = '定期試験';
                    let colorClass = 'bg-blue-500';
                    let titleColor = 'text-blue-800';
                    if (type === 'benesse') {
                        title = '学力推移調査';
                        colorClass = 'bg-green-500';
                        titleColor = 'text-green-800';
                    } else if (type === 'comprehensive') {
                        title = '学期総合';
                        colorClass = 'bg-purple-500';
                        titleColor = 'text-purple-800';
                    }

                    reportSections.push({
                        type,
                        title,
                        colorClass,
                        titleColor,
                        rawName,
                        mainSubjects,
                        subSubjects,
                        history,
                        stats
                    });
                });

                return reportSections;
            };

            const comprehensiveReportData = useMemo(() => {
                if (!selectedStudentId) return null;
                return getComprehensiveStudentReport(selectedStudentId);
            }, [selectedStudentId, exams, records]);

            const currentStudentName = comprehensiveReportData && comprehensiveReportData.length > 0 ? comprehensiveReportData[0].rawName : selectedStudentId;

            // --- ランキング表のデータ生成ロジック (v4.3) ---
            const currentExamRankingSections = useMemo(() => {
                if (!selectedExamId) return [];
                const exam = exams.find(e => e.id === selectedExamId);
                if (!exam) return [];
                const examType = exam.type || 'regular';

                let examRecords = records.filter(r => r.examId === selectedExamId);
                if (rankingClassFilter !== 'ALL') {
                    examRecords = examRecords.filter(r => r.class === rankingClassFilter);
                }

                const filterLabel = rankingClassFilter === 'ALL'
                    ? `学年全体（${examRecords.length}名）`
                    : `${rankingClassFilter}組（${examRecords.length}名）`;

                const buildColumnRanking = (colDef) => {
                    const getScore = (rec) => {
                        if (!rec || !rec.scores) return null;
                        if (rec.scores[colDef.scoreKey] !== undefined && rec.scores[colDef.scoreKey] !== null && !isNaN(rec.scores[colDef.scoreKey])) {
                            return Number(rec.scores[colDef.scoreKey]);
                        }
                        if (colDef.fallbackKeys) {
                            for (let i = 0; i < colDef.fallbackKeys.length; i++) {
                                const fk = colDef.fallbackKeys[i];
                                if (rec.scores[fk] !== undefined && rec.scores[fk] !== null && !isNaN(rec.scores[fk])) {
                                    return Number(rec.scores[fk]);
                                }
                            }
                        }
                        if (colDef.scoreKey === '5教科総点') {
                            const five = ['国語', '社会', '数学', '理科', '英語'];
                            const vals = five.map(s => rec.scores[s]).filter(v => v !== undefined && v !== null && !isNaN(v));
                            if (vals.length === 5) return vals.reduce((a, b) => a + Number(b), 0);
                        }
                        if (colDef.scoreKey === '9教科総点') {
                            const nine = ['国語', '社会', '数学', '理科', '英語', '音楽', '美術', '保体', '技家'];
                            const vals = nine.map(s => rec.scores[s]).filter(v => v !== undefined && v !== null && !isNaN(v));
                            if (vals.length === 9) return vals.reduce((a, b) => a + Number(b), 0);
                        }
                        return null;
                    };

                    const getDev = (rec) => {
                        if (!colDef.devKey || !rec || !rec.scores) return null;
                        const d = rec.scores[colDef.devKey];
                        return (d !== undefined && d !== null && !isNaN(d)) ? Number(d) : null;
                    };

                    const validList = [];
                    examRecords.forEach(rec => {
                        const sc = getScore(rec);
                        const dv = getDev(rec);
                        if (sc !== null) {
                            validList.push({
                                studentId: rec.studentId,
                                rawName: rec.rawName,
                                grade: rec.grade,
                                class: rec.class,
                                no: rec.no,
                                score: sc,
                                dev: dv
                            });
                        }
                    });

                    // 点数の高い順（同点の場合はクラス・番号順）でソート
                    validList.sort((a, b) => {
                        if (b.score !== a.score) return b.score - a.score;
                        if (a.dev !== null && b.dev !== null && b.dev !== a.dev) return b.dev - a.dev;
                        const codeA = `${a.grade}-${a.class}-${String(a.no).padStart(3, '0')}`;
                        const codeB = `${b.grade}-${b.class}-${String(b.no).padStart(3, '0')}`;
                        return codeA.localeCompare(codeB);
                    });

                    // 順位付け（同じ点数の場合は同じ順位）
                    let currentRank = 1;
                    const rankedList = validList.map((item, idx) => {
                        if (idx > 0) {
                            const prev = validList[idx - 1];
                            if (item.score !== prev.score) {
                                currentRank = idx + 1;
                            }
                        }
                        return { ...item, rank: currentRank };
                    });

                    // 1位〜20位までを抽出（同点20位も含める）
                    const topList = rankedList.filter(item => item.rank <= 20);

                    // 平均点・平均偏差値
                    const avgScore = validList.length > 0
                        ? (validList.reduce((acc, cur) => acc + cur.score, 0) / validList.length).toFixed(1)
                        : null;

                    const validDevList = validList.filter(item => item.dev !== null);
                    const avgDev = validDevList.length > 0
                        ? (validDevList.reduce((acc, cur) => acc + cur.dev, 0) / validDevList.length).toFixed(1)
                        : null;

                    return {
                        ...colDef,
                        topList,
                        avgScore,
                        avgDev,
                        totalCount: validList.length
                    };
                };

                const fiveSubjectCols = [
                    { key: 'kokugo', label: '国語', scoreKey: '国語', headerStyle: 'bg-red-50 text-red-800 border-red-400' },
                    { key: 'sugaku', label: '数学', scoreKey: '数学', headerStyle: 'bg-blue-50 text-blue-800 border-blue-400' },
                    { key: 'shakai', label: '社会', scoreKey: '社会', headerStyle: 'bg-orange-50 text-orange-800 border-orange-400' },
                    { key: 'rika', label: '理科', scoreKey: '理科', headerStyle: 'bg-emerald-50 text-emerald-800 border-emerald-400' },
                    { key: 'eigo', label: '英語', scoreKey: '英語', headerStyle: 'bg-purple-50 text-purple-800 border-purple-400' },
                    { key: 'total5', label: '5教科総点', scoreKey: '5教科総点', headerStyle: 'bg-slate-800 text-white border-slate-900', isTotal: true }
                ];

                if (examType === 'benesse') {
                    const benesseCols = [
                        { key: 'kokugo', label: '国語', scoreKey: '国語点数', devKey: '国語偏差値', headerStyle: 'bg-red-50 text-red-800 border-red-400' },
                        { key: 'sugaku', label: '数学', scoreKey: '数学点数', devKey: '数学偏差値', headerStyle: 'bg-blue-50 text-blue-800 border-blue-400' },
                        { key: 'eigo', label: '英語', scoreKey: '英語点数', devKey: '英語偏差値', headerStyle: 'bg-purple-50 text-purple-800 border-purple-400' },
                        { key: 'total3', label: '3教科', scoreKey: '3教科点数', devKey: '3教科偏差値', headerStyle: 'bg-slate-800 text-white border-slate-900', isTotal: true }
                    ];
                    return [{
                        id: 'benesse_ranking',
                        title: `${exam.name} ランキング表（TOP 20）`,
                        subtitle: '学力推移調査（国語・数学・英語・3教科 ／ 点数・偏差値）',
                        badgeColor: 'bg-green-600',
                        filterLabel,
                        isBenesse: true,
                        columns: benesseCols.map(buildColumnRanking)
                    }];
                }

                if (examType === 'comprehensive') {
                    const subSubjectCols = [
                        { key: 'ongaku', label: '音楽', scoreKey: '音楽', headerStyle: 'bg-pink-50 text-pink-800 border-pink-400' },
                        { key: 'bijutsu', label: '美術', scoreKey: '美術', headerStyle: 'bg-amber-50 text-amber-800 border-amber-400' },
                        { key: 'hotai', label: '保体', scoreKey: '保体', fallbackKeys: ['保健体育'], headerStyle: 'bg-cyan-50 text-cyan-800 border-cyan-400' },
                        { key: 'gika', label: '技家', scoreKey: '技家', fallbackKeys: ['技術家庭', '家庭科'], headerStyle: 'bg-indigo-50 text-indigo-800 border-indigo-400' },
                        { key: 'total9', label: '9教科総点', scoreKey: '9教科総点', headerStyle: 'bg-slate-800 text-white border-slate-900', isTotal: true }
                    ];
                    return [
                        {
                            id: 'comp_main_ranking',
                            title: `${exam.name} ランキング表【5教科】（TOP 20）`,
                            subtitle: '学期総合 - 5教科（国語・数学・社会・理科・英語・5教科総点）',
                            badgeColor: 'bg-purple-600',
                            filterLabel,
                            isBenesse: false,
                            columns: fiveSubjectCols.map(buildColumnRanking)
                        },
                        {
                            id: 'comp_sub_ranking',
                            title: `${exam.name} ランキング表【実技教科】（TOP 20）`,
                            subtitle: '学期総合 - 実技教科（音楽・美術・保体・技家・9教科総点）',
                            badgeColor: 'bg-purple-600',
                            filterLabel,
                            isBenesse: false,
                            columns: subSubjectCols.map(buildColumnRanking)
                        }
                    ];
                }

                // 定期試験 (regular)
                return [{
                    id: 'regular_ranking',
                    title: `${exam.name} ランキング表（TOP 20）`,
                    subtitle: '定期試験（国語・数学・社会・理科・英語・5教科総点）',
                    badgeColor: 'bg-blue-600',
                    filterLabel,
                    isBenesse: false,
                    columns: fiveSubjectCols.map(buildColumnRanking)
                }];
            }, [selectedExamId, exams, records, rankingClassFilter]);

            // --- Navigation Handler ---
            const handleNavigateStudent = (direction) => {
                if (!selectedStudentId || tableData.length === 0) return;
                
                const currentIndex = tableData.findIndex(r => r.studentId === selectedStudentId);
                if (currentIndex === -1) return;

                let nextIndex = currentIndex;
                if (direction === 'next' && currentIndex < tableData.length - 1) {
                    nextIndex = currentIndex + 1;
                } else if (direction === 'prev' && currentIndex > 0) {
                    nextIndex = currentIndex - 1;
                }
                
                if (nextIndex !== currentIndex) {
                    setSelectedStudentId(tableData[nextIndex].studentId);
                }
            };

            useEffect(() => {
                const handleKeyDown = (e) => {
                    if (!selectedStudentId) return;
                    if (e.key === 'ArrowRight') {
                        handleNavigateStudent('next');
                    } else if (e.key === 'ArrowLeft') {
                        handleNavigateStudent('prev');
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [selectedStudentId, tableData]);

            // --- CSV Export Handler ---
            const handleExportCurrentExamCSV = () => {
                if (!selectedExamId) return;
                const exam = exams.find(e => e.id === selectedExamId);
                if (!exam) return;

                if (tableData.length === 0) {
                    alert('出力するデータがありません。');
                    return;
                }

                const csvData = tableData.map(r => {
                    const row = {
                        '学年': r.grade,
                        '組': r.class,
                        '出席番号': r.no,
                        '氏名': r.rawName,
                        '学園奨学生': r.scholarship || ''
                    };
                    currentSubjects.forEach(sub => {
                        row[sub] = r.scores[sub] !== undefined ? r.scores[sub] : '';
                    });
                    return row;
                });

                const csvContent = Papa.unparse(csvData);
                const bom = new Uint8Array([0xEF, 0xBB, 0xBF]);
                const blob = new Blob([bom, csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.setAttribute('download', `${exam.name}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            // --- Print PDF Handler ---
            const triggerPrint = (targetIds, typesConfig, includeChartsFlag = false) => {
                setPrintModeType('report');
                setPrintTargetIds(targetIds);
                setPrintTargetTypes(typesConfig);
                setPrintIncludeCharts(includeChartsFlag);
                setIsPrinting(true);
                setTimeout(() => {
                    if(targetIds.length > 1) alert("印刷プレビューが開きます。\n「送信先（プリンター）」を「PDFに保存」にして保存してください。");
                    window.print();
                    setIsPrinting(false);
                    setPrintTargetIds([]);
                }, 600);
            };

            const triggerPrintRanking = () => {
                setPrintModeType('ranking');
                setIsPrinting(true);
                setTimeout(() => {
                    window.print();
                    setIsPrinting(false);
                }, 500);
            };

            const executePrintFromSettings = () => {
                let targets = [];
                if (printConfig.mode === 'all') {
                    targets = tableData.map(r => r.studentId);
                } else if (printConfig.mode === 'class') {
                    targets = tableData.filter(r => r.class === printConfig.targetClass).map(r => r.studentId);
                } else if (printConfig.mode === 'individual') {
                    targets = printConfig.selectedStudents;
                }

                if (targets.length === 0) {
                    alert('出力対象の生徒が選択されていません。');
                    return;
                }
                
                if (!printConfig.types.regular && !printConfig.types.benesse && !printConfig.types.comprehensive) {
                    alert('出力する試験種別を1つ以上選択してください。');
                    return;
                }

                setIsPrintMenuOpen(false);
                triggerPrint(targets, printConfig.types, printConfig.includeCharts);
            };


            // --- Render Helpers ---
            const renderDiffText = (diff, subjectName = '', extraClass = '') => {
                if (diff === undefined || diff === null || isNaN(diff)) return null;
                const isFloat = typeof subjectName === 'string' && (subjectName.includes('平均') || subjectName.includes('偏差値'));
                const isRank = typeof subjectName === 'string' && (subjectName.includes('席次') || subjectName.includes('順位'));
                let formattedDiff = isFloat ? Number(diff).toFixed(1) : Math.round(diff).toString();
                const diffNum = Number(formattedDiff);

                if (diffNum === 0) return <span className={`text-slate-400 ${extraClass}`}>(±0)</span>;

                if (diffNum > 0) {
                    return <span className={`font-medium ${isRank ? 'text-red-500' : 'text-green-600'} ${extraClass}`}>(+{formattedDiff})</span>;
                } else {
                    return <span className={`font-medium ${isRank ? 'text-green-600' : 'text-red-500'} ${extraClass}`}>({formattedDiff})</span>;
                }
            };

            const renderSortIcon = (key) => {
                if (sortConfig.key !== key) return <span className="text-gray-300 ml-1 text-[10px]">↕</span>;
                if (sortConfig.direction === 'asc') return <span className="text-blue-600 ml-1 text-[10px]" title="点数が小さい順">↑</span>;
                if (sortConfig.direction === 'desc') return <span className="text-blue-600 ml-1 text-[10px]" title="点数が大きい順">↓</span>;
                if (sortConfig.direction === 'diff_desc') return <span className="text-green-600 ml-1 text-[12px]" title="伸びた順">↗</span>;
                if (sortConfig.direction === 'diff_asc') return <span className="text-red-600 ml-1 text-[12px]" title="下がった順">↘</span>;
            };

            let selectedExamName = '';
            for(let i=0; i<currentExams.length; i++){
                if(currentExams[i].id === selectedExamId) {
                    selectedExamName = currentExams[i].name;
                    break;
                }
            }

            // --- Report Section Component (Reusable) ---
            const ReportSection = ({ section, isPrint, printPart = 'both', includeChartsInPrint = false, printSvgHeight = null, compactLevel = 'normal' }) => {
                if (!section) return null;

                const isUltraCompact = compactLevel === 'ultra';
                const isCompact = compactLevel === 'compact' || isUltraCompact;

                // 印刷時の分割指定（mainのみ / subのみ / 両方）に応じて表示対象を決定
                const cardSubjects = printPart === 'main'
                    ? section.mainSubjects
                    : (printPart === 'sub' ? section.subSubjects : [...section.mainSubjects, ...section.subSubjects]);

                const sectionHeading = (printPart === 'main' && section.subSubjects.length > 0)
                    ? `${section.title}（主要5教科）`
                    : (printPart === 'sub' ? `${section.title}（実技4教科・9教科総合）` : section.title);

                return (
                    <div className={`${isPrint ? 'mb-1' : 'mb-8 relative pl-3 sm:pl-4 border-l-2 border-slate-200'}`}>
                        {!isPrint && (
                            <div className={`absolute -left-[9px] top-0 w-4 h-4 rounded-full ${section.colorClass} border-2 border-white flex items-center justify-center`}></div>
                        )}
                        
                        <div className={`flex flex-wrap items-baseline justify-between gap-2 ${isUltraCompact ? 'mb-1' : (isCompact ? 'mb-1.5' : 'mb-2.5')}`}>
                            <h3 className={`${isCompact ? 'text-sm' : 'text-base sm:text-lg'} font-bold ${section.titleColor} flex items-center gap-2`}>
                                {isPrint && <span className={`inline-block w-3 h-3 rounded-full ${section.colorClass}`}></span>}
                                {sectionHeading}
                                <span className="text-[11px] font-bold text-slate-600 bg-slate-200/80 px-2 py-0.5 rounded-full">
                                    全{section.history.filter(h=>h.record).length}回分の個人推移
                                </span>
                            </h3>
                            <span className="text-[10px] sm:text-xs font-bold text-slate-600 bg-slate-100 border border-slate-200 px-2 py-0.5 rounded">
                                📊 各枠はこれまでの自分の<span className="text-slate-900 underline mx-0.5">過去平均</span>・<span className="text-red-700 mx-0.5">最高</span>・<span className="text-blue-700 mx-0.5">最低</span>の記録
                            </span>
                        </div>
                        
                        <div className={`stat-card-grid grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 ${isUltraCompact ? 'gap-1 mb-1.5' : (isCompact ? 'gap-1.5 mb-2' : 'gap-2.5 mb-3')}`}>
                            {cardSubjects.map(sub => {
                                const stat = section.stats[sub];
                                if (!stat) return null;
                                const isFloat = typeof sub === 'string' && (sub.includes('平均') || sub.includes('偏差値'));
                                const isRank = typeof sub === 'string' && (sub.includes('席次') || sub.includes('順位'));
                                // 席次・順位は数字が小さいほうが「最高」、大きいほうが「最低」
                                const bestVal = isRank ? stat.min : stat.max;
                                const worstVal = isRank ? stat.max : stat.min;

                                const displayAvg = isFloat ? Number(stat.avg).toFixed(1) : Math.round(stat.avg).toString();
                                const displayMax = isFloat ? Number(bestVal).toFixed(1) : Math.round(bestVal).toString();
                                const displayMin = isFloat ? Number(worstVal).toFixed(1) : Math.round(worstVal).toString();

                                return (
                                    <div key={sub} className={`${isUltraCompact ? 'p-1' : (isCompact ? 'p-1.5' : 'p-2.5')} rounded-lg border border-slate-300 shadow-sm flex flex-col justify-between bg-white`}>
                                        <div className={`${isUltraCompact ? 'text-[10.5px] mb-0.5 pb-0.5' : (isCompact ? 'text-[11px] mb-0.5 pb-0.5' : 'text-xs sm:text-[13px] mb-1 pb-1')} font-extrabold text-slate-800 border-b border-slate-200 truncate`} title={sub}>
                                            {sub}
                                        </div>
                                        <div className="flex justify-between items-baseline my-0.5 px-0.5">
                                            <span className="text-[10px] font-bold text-slate-600 whitespace-nowrap">過去平均</span>
                                            <span className={`${isUltraCompact ? 'text-sm' : (isCompact ? 'text-base' : 'text-lg sm:text-xl')} font-extrabold leading-none ${section.titleColor}`}>
                                                {displayAvg}
                                            </span>
                                        </div>
                                        <div className={`grid grid-cols-2 gap-1 ${isUltraCompact ? 'mt-0.5 pt-0.5' : (isCompact ? 'mt-1 pt-1' : 'mt-1.5 pt-1.5')} border-t border-slate-100`}>
                                            <div className="bg-red-50 border border-red-200/80 px-1 py-0.5 rounded flex items-baseline justify-between whitespace-nowrap">
                                                <span className="text-[9.5px] font-bold text-red-700 shrink-0">最高</span>
                                                <span className={`${isCompact ? 'text-[11px]' : 'text-xs sm:text-[12.5px]'} font-extrabold text-red-700 ml-0.5`}>{displayMax}</span>
                                            </div>
                                            <div className="bg-blue-50 border border-blue-200/80 px-1 py-0.5 rounded flex items-baseline justify-between whitespace-nowrap">
                                                <span className="text-[9.5px] font-bold text-blue-700 shrink-0">最低</span>
                                                <span className={`${isCompact ? 'text-[11px]' : 'text-xs sm:text-[12.5px]'} font-extrabold text-blue-700 ml-0.5`}>{displayMin}</span>
                                            </div>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>

                        {printPart !== 'sub' && (
                            <InteractiveReportTable
                                section={section}
                                subjects={section.mainSubjects}
                                titleSuffix={section.subSubjects.length > 0 ? "主要教科（5教科）" : ""}
                                tableType="main"
                                isPrint={isPrint}
                                includeChartsInPrint={includeChartsInPrint}
                                printSvgHeight={printSvgHeight}
                                compactLevel={compactLevel}
                                renderDiffText={renderDiffText}
                            />
                        )}
                        {printPart !== 'main' && (
                            <InteractiveReportTable
                                section={section}
                                subjects={section.subSubjects}
                                titleSuffix="実技・総合（4教科＋9教科平均）"
                                tableType="sub"
                                isPrint={isPrint}
                                includeChartsInPrint={includeChartsInPrint}
                                printSvgHeight={printSvgHeight}
                                compactLevel={compactLevel}
                                renderDiffText={renderDiffText}
                            />
                        )}
                    </div>
                );
            };

            return (
                <div>
                    {/* --- MAIN UI (Hides during print) --- */}
                    <div className={isPrinting ? 'no-print' : 'flex flex-col h-screen overflow-hidden'}>
                        {/* Header */}
                        <header className="bg-slate-900 text-white p-3 sm:p-4 flex flex-wrap justify-between items-center shrink-0 relative z-40 gap-y-3">
                            <div className="flex items-center gap-3 order-1">
                                <button 
                                    onClick={() => setIsSidebarOpen(!isSidebarOpen)} 
                                    className="text-slate-300 hover:text-white transition-colors p-1.5 rounded hover:bg-slate-800 shrink-0"
                                    title="サイドバーの開閉"
                                >
                                    <IconMenu />
                                </button>
                                <div className="bg-blue-600 p-2 rounded-lg shrink-0">
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                                </div>
                                <h1 className="text-xl font-bold tracking-wider hidden sm:block whitespace-nowrap">BLEND 成績推移トラッカー <span className="text-sm font-normal text-slate-400 ml-2">v4.4</span></h1>
                            </div>
                            
                            {/* Settings Button & Clear Data */}
                            <div className="flex items-center gap-1 sm:gap-2 order-2 sm:order-3 ml-auto sm:ml-0 shrink-0">
                                <button onClick={() => setIsSettingsOpen(true)} className="text-slate-300 hover:text-white transition-colors p-2 rounded hover:bg-slate-800" title="データ同期と設定">
                                    <IconSettings />
                                </button>
                                <button onClick={handleClearData} className="text-slate-400 hover:text-red-400 transition-colors p-2 rounded" title="全データクリア">
                                    <IconTrash />
                                </button>
                            </div>

                            {/* CSV Import Block */}
                            <div className="bg-slate-800 p-1.5 rounded-md flex items-center gap-1 sm:gap-2 border border-slate-700 w-full sm:w-auto order-3 sm:order-2">
                                <div className="relative shrink-0">
                                    <button 
                                        onClick={(e) => { e.stopPropagation(); setIsDlMenuOpen(!isDlMenuOpen); }} 
                                        className="text-slate-300 hover:text-white text-[13px] py-1.5 px-2 sm:px-3 rounded flex items-center gap-1 transition-colors"
                                    >
                                        <IconDownload />
                                        <span className="hidden md:inline">フォーマットDL</span>
                                        <IconChevronDown />
                                    </button>
                                    {isDlMenuOpen && (
                                        <div className="absolute top-full left-0 mt-1 bg-white border border-slate-200 rounded shadow-xl z-50 overflow-hidden min-w-[160px]">
                                            <button 
                                                onClick={() => { handleDownloadSampleCSV('regular'); setIsDlMenuOpen(false); }}
                                                className="w-full text-left px-4 py-3 text-[13px] text-slate-700 hover:bg-blue-50 hover:text-blue-700 font-medium border-b border-slate-100"
                                            >
                                                📄 定期試験用 CSV
                                            </button>
                                            <button 
                                                onClick={() => { handleDownloadSampleCSV('comprehensive'); setIsDlMenuOpen(false); }}
                                                className="w-full text-left px-4 py-3 text-[13px] text-slate-700 hover:bg-blue-50 hover:text-blue-700 font-medium border-b border-slate-100"
                                            >
                                                📄 学期総合用 CSV
                                            </button>
                                            <button 
                                                onClick={() => { handleDownloadSampleCSV('benesse'); setIsDlMenuOpen(false); }}
                                                className="w-full text-left px-4 py-3 text-[13px] text-slate-700 hover:bg-blue-50 hover:text-blue-700 font-medium"
                                            >
                                                📄 学力推移調査用 CSV
                                            </button>
                                        </div>
                                    )}
                                </div>
                                <div className="w-px h-6 bg-slate-700 hidden sm:block mx-1"></div>
                                <input 
                                    type="text" 
                                    placeholder="試験名 (例: 2年1学期中間)" 
                                    className="bg-transparent text-[13px] px-2 py-1 outline-none text-white placeholder-slate-400 flex-1 min-w-[100px] sm:w-32 md:w-48"
                                    value={importExamName}
                                    onChange={(e) => setImportExamName(e.target.value)}
                                />
                                <label className="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white text-[13px] py-1.5 px-3 rounded flex items-center gap-1 transition-colors shrink-0">
                                    <IconUpload />
                                    <span>CSV読込</span>
                                    <input type="file" accept=".csv" className="hidden" ref={fileInputRef} onChange={handleImportCSV} />
                                </label>
                            </div>
                        </header>

                        {/* Main Content Area */}
                        <div className="flex flex-1 overflow-hidden relative">
                            
                            {/* Sidebar: Exam List & Tabs */}
                            <div className={`transition-all duration-300 ease-in-out ${isSidebarOpen ? 'w-56 border-r opacity-100' : 'w-0 border-r-0 opacity-0'} bg-white border-slate-200 flex flex-col shrink-0 z-10 overflow-hidden`}>
                                <div className="w-56 flex flex-col h-full">
                                    <div className="flex border-b border-slate-200 bg-slate-50 flex-wrap">
                                        <button 
                                            className={`flex-1 py-2 px-1 text-[11px] font-bold transition-colors ${activeTab === 'regular' ? 'text-blue-600 border-b-2 border-blue-600 bg-white' : 'text-slate-500 hover:bg-slate-100'}`}
                                            onClick={() => setActiveTab('regular')}
                                        >
                                            定期試験
                                        </button>
                                        <button 
                                            className={`flex-1 py-2 px-1 text-[11px] font-bold transition-colors ${activeTab === 'benesse' ? 'text-blue-600 border-b-2 border-blue-600 bg-white' : 'text-slate-500 hover:bg-slate-100'}`}
                                            onClick={() => setActiveTab('benesse')}
                                        >
                                            学力推移
                                        </button>
                                        <button 
                                            className={`flex-1 py-2 px-1 text-[11px] font-bold transition-colors ${activeTab === 'comprehensive' ? 'text-blue-600 border-b-2 border-blue-600 bg-white' : 'text-slate-500 hover:bg-slate-100'}`}
                                            onClick={() => setActiveTab('comprehensive')}
                                        >
                                            学期総合
                                        </button>
                                    </div>
                                    <div className="flex-1 overflow-y-auto bg-slate-50/30">
                                        {currentExams.length === 0 ? (
                                            <div className="p-8 text-center text-[13px] text-slate-400">
                                                データがありません<br/>右上のボタンから<br/>CSVを読み込んでください
                                            </div>
                                        ) : (
                                            <ul className="divide-y divide-slate-100">
                                                {currentExams.map((exam, idx) => (
                                                    <li key={exam.id} className={`group flex justify-between items-center p-3 cursor-pointer transition-colors ${selectedExamId === exam.id ? 'bg-blue-50 border-l-4 border-blue-600' : 'hover:bg-slate-100 border-l-4 border-transparent'}`} onClick={() => setSelectedExamId(exam.id)}>
                                                        <div>
                                                            <div className={`font-medium text-[13px] ${selectedExamId === exam.id ? 'text-blue-700' : 'text-slate-700'}`}>{exam.name}</div>
                                                            <div className="text-[11px] text-slate-400 mt-0.5">#{idx + 1}</div>
                                                        </div>
                                                        <button onClick={(e) => { e.stopPropagation(); handleDeleteExam(exam.id); }} className="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity p-1">
                                                            <IconTrash />
                                                        </button>
                                                    </li>
                                                ))}
                                            </ul>
                                        )}
                                    </div>
                                </div>
                            </div>

                            {/* Main Table Area */}
                            <div className="flex-1 flex flex-col bg-slate-50 relative overflow-hidden">
                                {selectedExamId && currentExams.length > 0 ? (
                                    <>
                                        <div className="p-4 bg-white border-b border-slate-200 flex justify-between items-end shrink-0">
                                            <div>
                                                <div className="flex items-center gap-2">
                                                    <span className={`text-[10px] font-bold px-2 py-0.5 rounded text-white ${activeTab === 'regular' ? 'bg-blue-500' : (activeTab === 'benesse' ? 'bg-green-500' : 'bg-purple-500')}`}>
                                                        {activeTab === 'regular' ? '定期試験' : (activeTab === 'benesse' ? '学力推移' : '学期総合')}
                                                    </span>
                                                    <h2 className="text-xl font-bold text-slate-800">{selectedExamName}</h2>
                                                </div>
                                                <p className="text-xs text-slate-500 mt-1">
                                                    生徒数: <span className="font-semibold">{tableData.length}</span>名 <span className="mx-2">|</span> 
                                                    主要教科受験者数: <span className="font-semibold">{examineeCount}</span>名 <span className="mx-2">|</span> 
                                                    {previousExamId ? '前回比較あり' : '初回データ'}
                                                </p>
                                            </div>
                                            <div className="flex flex-wrap items-center gap-2">
                                                <button 
                                                    onClick={() => {
                                                        setRankingClassFilter('ALL');
                                                        setIsRankingOpen(true);
                                                    }}
                                                    className="text-xs bg-amber-50 hover:bg-amber-100 text-amber-800 font-extrabold py-1.5 px-3 rounded border border-amber-300 flex items-center gap-1.5 shadow-sm transition-colors"
                                                >
                                                    <IconTrophy /> ランキング表
                                                </button>
                                                <label className="cursor-pointer text-xs bg-white hover:bg-slate-50 text-slate-600 font-medium py-1.5 px-2 rounded border border-slate-300 flex items-center gap-1 shadow-sm transition-colors">
                                                    <IconUpload /> 試験をCSVで上書き
                                                    <input type="file" accept=".csv" className="hidden" onChange={handleUpdateCSV} />
                                                </label>
                                                <button 
                                                    onClick={handleExportCurrentExamCSV}
                                                    className="text-xs bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-1.5 px-2 rounded border border-blue-200 flex items-center gap-1 shadow-sm transition-colors"
                                                >
                                                    <IconDownload /> 表示順でCSV保存
                                                </button>
                                                {/* NEW: PDF Print Settings Button */}
                                                <button 
                                                    onClick={() => {
                                                        // 設定メニューを開く前に、初期値として現在表示中の生徒一覧を全選択状態にしておく
                                                        setPrintConfig(prev => ({...prev, selectedStudents: tableData.map(r => r.studentId)}));
                                                        setIsPrintMenuOpen(true);
                                                    }}
                                                    className="text-xs bg-emerald-50 hover:bg-emerald-100 text-emerald-700 font-bold py-1.5 px-2 rounded border border-emerald-200 flex items-center gap-1 shadow-sm transition-colors"
                                                >
                                                    <IconPrinter /> PDF/印刷出力設定
                                                </button>
                                            </div>
                                        </div>
                                        
                                        <div className="flex-1 overflow-auto relative z-0 pb-2">
                                            <table className="w-full text-xs text-left whitespace-nowrap bg-white border-separate border-spacing-0">
                                                <thead className="text-[11px] text-slate-600 uppercase bg-slate-100 shadow-sm">
                                                    <tr>
                                                        <th className="px-2 py-2 sticky left-0 top-0 bg-slate-100 border-b border-slate-200 min-w-[32px] w-[32px] text-center text-slate-400 z-40">
                                                            #
                                                        </th>
                                                        <th className="px-2 py-2 sticky left-[32px] top-0 bg-slate-100 cursor-pointer hover:bg-slate-200 border-b border-slate-200 min-w-[90px] w-[90px] z-40" onClick={() => handleSort('class_no')}>
                                                            クラス/番号 {renderSortIcon('class_no')}
                                                        </th>
                                                        <th className="px-2 py-2 sticky left-[122px] top-0 bg-slate-100 cursor-pointer hover:bg-slate-200 border-b border-slate-200 min-w-[120px] w-[120px] shadow-[2px_0_5px_rgba(0,0,0,0.05)] z-40" onClick={() => handleSort('name')}>
                                                            氏名 {renderSortIcon('name')}
                                                        </th>
                                                        <th className="px-1 py-2 sticky top-0 bg-slate-100 cursor-pointer hover:bg-slate-200 border-b border-slate-200 min-w-[48px] w-[48px] text-center whitespace-nowrap z-30" onClick={() => handleSort('scholarship')}>
                                                            奨 {renderSortIcon('scholarship')}
                                                        </th>
                                                        {currentSubjects.map(sub => (
                                                            <th key={sub} className="px-2 py-2 sticky top-0 bg-slate-100 cursor-pointer hover:bg-slate-200 border-b border-slate-200 min-w-[92px] w-[92px] text-center z-30" onClick={() => handleSort(`score_${sub}`)}>
                                                                {sub} {renderSortIcon(`score_${sub}`)}
                                                            </th>
                                                        ))}
                                                        <th className="w-full sticky top-0 bg-slate-100 border-b border-slate-200 z-30"></th>
                                                    </tr>
                                                </thead>
                                                <tbody className="divide-y divide-slate-100">
                                                    {tableData.map((row, index) => (
                                                        <tr key={row.studentId} onClick={() => setSelectedStudentId(row.studentId)} className="hover:bg-blue-50 cursor-pointer transition-colors group">
                                                            <td className="px-2 py-1.5 sticky left-0 bg-white group-hover:bg-blue-50 min-w-[32px] w-[32px] text-center text-[11px] text-slate-400 border-r border-slate-50 z-20">
                                                                {index + 1}
                                                            </td>
                                                            <td className={`px-2 py-1.5 sticky left-[32px] bg-white group-hover:bg-blue-50 min-w-[90px] w-[90px] font-mono font-bold z-20 ${row.class === 'A' ? 'text-red-600' : row.class === 'B' ? 'text-blue-600' : 'text-slate-500'}`}>
                                                                {row.grade}-{row.class}-{row.no.toString().padStart(2, '0')}
                                                            </td>
                                                            <td className="px-2 py-1.5 sticky left-[122px] bg-white group-hover:bg-blue-50 min-w-[120px] w-[120px] font-medium text-slate-800 shadow-[2px_0_5px_rgba(0,0,0,0.02)] truncate z-20">
                                                                {row.rawName}
                                                            </td>
                                                            <td className="px-1 py-1.5 text-center text-[10px] font-bold border-l border-slate-50 min-w-[48px] w-[48px] bg-white group-hover:bg-blue-50 z-10">
                                                                {row.scholarship && (
                                                                    <span className="bg-amber-100 text-amber-800 border border-amber-200 px-1 py-0.5 rounded shadow-sm whitespace-nowrap">
                                                                        {row.scholarship.replace('学生', '')}
                                                                    </span>
                                                                )}
                                                            </td>
                                                            {currentSubjects.map(sub => {
                                                                const score = row.scores[sub];
                                                                const diff = row.diffs[sub];
                                                                return (
                                                                    <td key={sub} className={`px-1 py-1.5 text-center border-l border-slate-50 min-w-[92px] w-[92px] bg-white group-hover:bg-blue-50 z-10`}>
                                                                        <div className="flex items-center justify-center gap-0.5">
                                                                            <span className={`inline-block w-8 text-right py-0.5 rounded text-[13px] font-bold ${getScoreColor(score, sub)}`}>
                                                                                {formatScore(score, sub)}
                                                                            </span>
                                                                            <span className="w-10 text-left shrink-0">
                                                                                {previousExamId && score !== undefined && renderDiffText(diff, sub, 'text-[10px] font-medium ml-0.5')}
                                                                            </span>
                                                                        </div>
                                                                    </td>
                                                                );
                                                            })}
                                                            <td className="w-full bg-white group-hover:bg-blue-50 z-10"></td>
                                                        </tr>
                                                    ))}
                                                    {tableData.length === 0 && (
                                                        <tr>
                                                            <td colSpan={currentSubjects.length + 5} className="px-4 py-8 text-center text-slate-500">
                                                                データがありません
                                                            </td>
                                                        </tr>

                                                            <td className="px-2 py-2 sticky left-[122px] bottom-0 bg-slate-100 text-right border-t border-slate-300 shadow-[2px_0_5px_rgba(0,0,0,0.05)] min-w-[120px] w-[120px] z-30">
                                                                全体平均
                                                            </td>
                                                            <td className="px-1 py-2 sticky bottom-0 border-t border-slate-300 bg-slate-100 min-w-[48px] w-[48px] z-10"></td>

                                                                <td key={sub} className="px-1 py-2 sticky bottom-0 text-center border-t border-slate-300 border-l border-slate-200 min-w-[92px] w-[92px] bg-slate-100 z-10">
                                                                    {averages[sub] !== null ? Number(averages[sub]).toFixed(1) : '-'}
                                                                </td>
                                                            ))}
                                                            <td className="w-full sticky bottom-0 border-t border-slate-300 bg-slate-100 z-10"></td>
                                                        </tr>
                                                    </tfoot>
                                                )}
                                            </table>
                                        </div>
                                    </>
